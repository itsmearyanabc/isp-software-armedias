<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Medias CRM — Master Console</title>
  <!-- AR Medias CRM — Master Console. © AR Medias. All rights reserved. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root { --ink:#2B2F36; --ink2:#4A4F57; --dark:#0c1017; --gold:#D4AF37; --bg:#F4F5F7; --line:#e3e6eb; --muted:#6b7280; --ok:#1e7e34; --warn:#b06000; --bad:#c5221f; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:#1a1a1a; }
    input, select, textarea { font-size:16px; font-family:inherit; }
    .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:linear-gradient(135deg,var(--ink),var(--dark)); }
    .login-box { background:#fff; width:100%; max-width:380px; padding:36px 28px; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.35); text-align:center; }
    .login-box img { width:96px; height:96px; margin-bottom:12px; border-radius:12px; }
    .brand { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); font-weight:800; }
    .login-box h2 { margin:6px 0 22px; color:var(--ink); }
    .fg { margin-bottom:14px; text-align:left; }
    .fg label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:5px; }
    .fg input, .fg select, .fg textarea { width:100%; padding:11px 12px; border:1px solid #cfd4db; border-radius:9px; background:#fff; }
    .fg input:focus, .fg select:focus, .fg textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,.18); }
    .fg .hint { font-size:12px; color:var(--muted); margin-top:4px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; border-radius:9px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; min-height:40px; }
    .btn:disabled { opacity:.6; cursor:default; }
    .btn-dark { background:var(--ink); color:#fff; } .btn-dark:hover { background:var(--dark); }
    .btn-gold { background:var(--gold); color:#222; }
    .btn-ok { background:var(--ok); color:#fff; } .btn-bad { background:var(--bad); color:#fff; }
    .btn-light { background:#eef0f3; color:#333; }
    .btn-sm { padding:6px 10px; min-height:32px; font-size:13px; }
    .err { color:var(--bad); margin-top:10px; font-size:14px; }
    .top { background:linear-gradient(90deg,var(--ink),var(--dark)); color:#fff; padding:12px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
    .top img { width:38px; height:38px; background:#fff; border-radius:8px; padding:2px; }
    .top .t1 { font-weight:800; font-size:16px; } .top .t2 { font-size:11px; color:var(--gold); letter-spacing:1px; text-transform:uppercase; }
    .top .sp { flex:1; }
    .tabs { display:flex; gap:6px; }
    .tab { background:rgba(255,255,255,.08); color:#ddd; border:none; padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:600; }
    .tab.on { background:var(--gold); color:#222; }
    .wrap { max-width:1300px; margin:0 auto; padding:18px 16px 40px; }
    .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
    .kpi { background:#fff; border-radius:12px; padding:14px; border-left:4px solid var(--gold); box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .kpi .n { font-size:24px; font-weight:800; color:var(--ink); } .kpi .l { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; margin-top:3px; }
    .card { background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .card-h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; border-bottom:1px solid var(--line); }
    .card-h h3 { font-size:16px; color:var(--ink); margin-right:auto; display:flex; align-items:center; gap:8px; }
    .search { padding:8px 11px; border:1px solid #cfd4db; border-radius:8px; min-width:220px; }
    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th { text-align:left; background:#f6f7f9; color:#444; font-size:12px; text-transform:uppercase; letter-spacing:.4px; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
    td { padding:10px 12px; border-bottom:1px solid #f0f1f4; vertical-align:middle; }
    tr:hover td { background:#fafbfc; }
    .sub { color:var(--muted); font-size:12px; }
    .b { display:inline-block; padding:3px 9px; border-radius:10px; font-size:12px; font-weight:700; text-transform:capitalize; white-space:nowrap; }
    .b-ok { background:#e6f4ea; color:var(--ok); } .b-warn { background:#fef7e0; color:var(--warn); } .b-bad { background:#fce8e6; color:var(--bad); } .b-n { background:#eceef1; color:#444; }
    .ic { width:32px; height:32px; border:none; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; margin:0 2px; background:#eef0f3; color:#333; }
    .ic:hover { background:var(--ink); color:#fff; }
    .ic.g { background:#e6f4ea; color:var(--ok); } .ic.r { background:#fce8e6; color:var(--bad); } .ic.y { background:#fbf1dc; color:#8a6d1f; }
    .empty { padding:40px; text-align:center; color:var(--muted); }
    .ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding:30px 12px; z-index:20; overflow-y:auto; }
    .md { background:#fff; width:100%; max-width:760px; border-radius:14px; overflow:hidden; }
    .md.wide { max-width:1000px; }
    .md-h { background:var(--ink); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:10px; }
    .md-h h3 { font-size:17px; margin-right:auto; display:flex; gap:8px; align-items:center; }
    .md-x { background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer; }
    .md-b { padding:18px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
    .full { grid-column:1/-1; }
    .sec { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--gold); font-weight:800; margin:6px 0 10px; grid-column:1/-1; border-bottom:1px solid var(--line); padding-bottom:6px; }
    .cred { background:#0c1017; color:#f5f5f5; border-radius:10px; padding:14px 16px; font-family:Menlo,Consolas,monospace; font-size:14px; line-height:1.8; white-space:pre-wrap; word-break:break-all; }
    .row-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
    .stat { background:#f6f7f9; border-radius:10px; padding:10px 12px; } .stat .n { font-weight:800; font-size:18px; color:var(--ink); } .stat .l { font-size:11px; color:var(--muted); text-transform:uppercase; font-weight:700; }
    .info { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px 16px; margin-bottom:14px; font-size:14px; }
    .info b { display:block; font-size:11px; color:var(--muted); text-transform:uppercase; }
    .chk { display:flex; align-items:center; gap:8px; font-size:14px; margin:6px 0 14px; }
    @media (max-width:640px){ .grid2 { grid-template-columns:1fr; } .search { min-width:0; width:100%; } }
  </style>
</head>
