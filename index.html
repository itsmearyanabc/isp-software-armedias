          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))', gap:16 }}>{[0,1,2].map(card)}</div>
          <div className="lte-card" style={{ marginTop:16 }}>
            <div className="lte-card-head"><div className="skeleton" style={{ height:14, width:200, background:'rgba(255,255,255,0.4)' }}></div></div>
            <div className="lte-card-body" style={{ height:300 }}><div className="skeleton" style={{ height:'100%' }}></div></div>
          </div>
        </div>
      );
    }

    function DashboardView({ currentUser, perms, lookups, onNav }) {
      const { data, isLoading, isValidating, mutate } = useSWR('dash:stats', () => gsRun('getDashboardStats', currentUser), { refreshInterval:60000 });
      const { data: acData } = useSWR('dash:action', () => gsRun('getActionCenter', currentUser), { revalidateOnFocus:false, refreshInterval:60000 });
      const stats = data && data.success ? data.data : null;
      const ac = acData && acData.success ? acData.data : null;
      const chartRef = useRef(null), chartInst = useRef(null);
      const [pay, setPay] = useState(null);
      const canPay = can(perms, 'payments', 'a'), canBill = can(perms, 'invoices', 'a');
      const nav = (k) => onNav && onNav(k);

      useEffect(() => {
        if (!stats || !stats.last6 || !chartRef.current || typeof Chart === 'undefined') return;
        if (chartInst.current) { try { chartInst.current.destroy(); } catch (e) {} }
        chartInst.current = new Chart(chartRef.current, {
          type:'bar',
          data:{ labels: stats.last6.map(m => m.month), datasets:[{ label:'Collected (Rs)', data: stats.last6.map(m => m.total), backgroundColor:'#c9a24b', borderRadius:6 }] },
          options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true } } }
        });
        return () => { if (chartInst.current) { try { chartInst.current.destroy(); } catch (e) {} } };
      }, [stats]);

      const runBilling = () => Swal.fire({ input:'text', inputLabel:'Billing month (YYYY-MM)', inputValue:(new Date()).toISOString().slice(0,7), showCancelButton:true, confirmButtonText:'Generate Invoices' })
        .then(res => { if (res.isConfirmed) gsRun('generateMonthlyInvoices', currentUser, res.value).then(r => {
          Swal.fire({ icon:(r && r.success) ? 'success' : 'error', title:(r && r.success) ? 'Done' : 'Error', text:(r && r.message) || 'Failed' });
          mutate(); mutateLedger();
        }); });

      const savePay = (form) => gsRun('tblInsert', currentUser, 'payments', form).then(r => {
        if (r && r.success) { setPay(null); Swal.fire({ icon:'success', title:'Payment recorded', timer:1300, showConfirmButton:false }); mutate(); mutateLedger(); }
        else Swal.fire({ icon:r && r.duplicate ? 'warning' : 'error', title:r && r.duplicate ? 'Duplicate not allowed' : 'Error', text:(r && r.message) || 'Failed' });
      });

      if (isLoading) return <DashboardSkeleton />;

      const s = stats || {};
      const box = (cls, icon, val, label, navKey) => (
        <div className={`small-box ${cls}`} style={{ cursor: navKey ? 'pointer' : 'default' }} onClick={() => navKey && nav(navKey)}>
          <div className="sb-inner"><h3>{val}</h3><p>{label}</p></div>
          <i className={`fas ${icon} sb-icon`}></i>
          {navKey && <span className="sb-footer">View <i className="fas fa-arrow-circle-right"></i></span>}
        </div>
      );
      const waBtn = (phone, msg) => phone ? <button className="action-icon" style={{ background:'#e7f8ec', color:'#1e7e34' }} title="WhatsApp" onClick={(e) => { e.stopPropagation(); window.open(waLink(phone, msg), '_blank'); }}><i className="fab fa-whatsapp"></i></button> : null;

      return (
        <div>
          <div className="bulk-bar" style={{ background:'linear-gradient(135deg,#33383d,#454c53)' }}>
            <span className="bb-count"><i className="fas fa-bolt"></i> Quick:</span>
            <button className="btn btn-success" onClick={() => nav('customers')}><i className="fas fa-user-plus"></i> {P.customers}</button>
            {canPay && <button className="btn btn-primary" onClick={() => setPay({})}><i className="fas fa-money-bill-wave"></i> Record Payment</button>}
            {canBill && <button className="btn btn-primary" onClick={runBilling}><i className="fas fa-bolt"></i> Run Monthly Billing</button>}
            <button className="btn btn-primary" onClick={() => nav('recovery')}><i className="fas fa-hand-holding-dollar"></i> Recovery Board</button>
          </div>

          <div className="smallbox-row">
            {box('sb-navy',  'fa-user-tie',            s.totalCustomers || 0,                'Total ' + P.customers, 'customers')}
            {box('sb-green', P.type === 'isp' ? 'fa-wifi' : 'fa-user-check', s.activeConnections || 0, P.type === 'isp' ? 'Active Connections' : 'Active ' + P.customers, 'customers')}
            {box('sb-blue',  'fa-money-bill-wave',     fmtMoney(s.collectedThisMonth || 0),  'Collected This Month', 'payments')}
            {box('sb-red',   'fa-exclamation-circle',  fmtMoney(s.outstanding || 0),         'Outstanding', 'recovery')}
          </div>
          <div className="smallbox-row">
            {box('sb-amber', 'fa-file-invoice-dollar', fmtMoney(s.invoicedThisMonth || 0),   'Invoiced This Month', 'invoices')}
            {box('sb-teal',  'fa-headset',             s.openComplaints || 0,                'Open Complaints', 'complaints')}
            {box('sb-navy',  'fa-user-plus',           s.activeLeads || 0,                   'Active Leads', 'leads')}
            {box('sb-amber', 'fa-pause-circle',        (P.type === 'isp' ? s.suspended : s.inactive) || 0, P.type === 'isp' ? 'Suspended' : 'Inactive', 'customers')}
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))', gap:16 }}>
            <div className="lte-card">
              <div className="lte-card-head"><i className="fas fa-triangle-exclamation"></i> Overdue Invoices {ac ? '(' + ac.overdue.length + ')' : ''}</div>
              <div className="lte-card-body" style={{ padding:0, maxHeight:320, overflowY:'auto' }}>
                {!ac ? <div style={{ padding:16 }}><TableSkeleton rows={4} columns={3} /></div> :
                 ac.overdue.length ? ac.overdue.map(o => (
                  <div key={o.id} className="ac-row">
                    <div><b>{o.customer}</b><br /><span style={{ color:'#888', fontSize:12 }}>{o.invoice_number} · due {o.due_date}</span></div>
                    <div style={{ textAlign:'right', whiteSpace:'nowrap' }}><b style={{ color:'#b02a23' }}>{fmtMoney(o.total)}</b><br />
                      {waBtn(o.phone, `Dear ${o.customer}, your invoice ${o.invoice_number} of ${fmtMoney(o.total)} is overdue (due ${o.due_date}). Kindly pay ${P.dun}.`)}
                      {canPay && <button className="action-icon edit-icon" title="Record Payment" onClick={() => setPay({ invoice_id:o.id, customer_id:o.customer_id, amount:o.total })}><i className="fas fa-money-bill-wave"></i></button>}
                    </div>
                  </div>
                 )) : <div className="ac-empty">No overdue invoices 🎉</div>}
              </div>
            </div>

            <div className="lte-card">
              <div className="lte-card-head"><i className="fas fa-bell"></i> Follow-ups Due {ac ? '(' + ac.followups.length + ')' : ''}</div>
              <div className="lte-card-body" style={{ padding:0, maxHeight:320, overflowY:'auto' }}>
                {!ac ? <div style={{ padding:16 }}><TableSkeleton rows={4} columns={2} /></div> :
                 ac.followups.length ? ac.followups.map((f, i) => (
                  <div key={i} className="ac-row">
                    <div><span className={`eb ${f.type === 'Promise' ? 'eb-warn' : 'eb-neutral'}`}>{f.type}</span> <b>{f.who}</b><br /><span style={{ color:'#888', fontSize:12 }}>due {f.date}</span></div>
                    <div>{waBtn(f.phone, `Dear ${f.who}, `)}</div>
                  </div>
                 )) : <div className="ac-empty">No follow-ups due 🎉</div>}
              </div>
            </div>

            <div className="lte-card">
              <div className="lte-card-head"><i className="fas fa-headset"></i> Open Complaints {ac ? '(' + ac.openComplaints.length + ')' : ''}</div>
              <div className="lte-card-body" style={{ padding:0, maxHeight:320, overflowY:'auto' }}>
                {!ac ? <div style={{ padding:16 }}><TableSkeleton rows={4} columns={2} /></div> :
                 ac.openComplaints.length ? ac.openComplaints.map(c => (
                  <div key={c.id} className="ac-row" style={{ cursor:'pointer' }} onClick={() => nav('complaints')}>
                    <div><b>{c.subject}</b><br /><span style={{ color:'#888', fontSize:12 }}>{c.ticket} · {c.customer}</span></div>
                    <div><span className={`eb ${badgeClass(c.priority)}`}>{c.priority}</span></div>
                  </div>
                 )) : <div className="ac-empty">No open complaints 🎉</div>}
              </div>
            </div>
          </div>

          <div className="lte-card" style={{ marginTop:16 }}>
            <div className="lte-card-head"><i className="fas fa-chart-column"></i> Collections — Last 6 Months</div>
            <div className="lte-card-body" style={{ height:'300px' }}><canvas ref={chartRef}></canvas></div>
          </div>

          {pay && <EntityModal cfg={MODULES.payments} initial={pay} lookups={lookups} currentUser={currentUser} onClose={() => setPay(null)} onSave={savePay} />}
        </div>
      );
    }

    // ============== Recovery Board ==============
    function RecoveryView({ currentUser, perms, lookups }) {
      const { register: regRV } = React.useContext(PageActionsCtx);
      const acRV = useRef({});
      const { data, mutate } = useSWR('recovery', () => gsRun('getRecovery', currentUser), { revalidateOnFocus:false });
      const all = (data && data.success) ? data.data : (data ? [] : undefined);
      const [q, setQ] = useState('');
      const [area, setArea] = useState('');
      const [pay, setPay] = useState(null);
      const canPay = can(perms, 'payments', 'a'), canEditCust = can(perms, 'customers', 'e');
      const areaLabel = (id) => { const a = ((lookups && lookups.areas) || []).find(o => String(o.id) === String(id)); return a ? a.label : id; };
      const rows = (all || []).filter(r => {
        if (area && String(r.area_id) !== String(area)) return false;
        if (q && (String(r.full_name) + ' ' + String(r.customer_code) + ' ' + String(r.phone)).toLowerCase().indexOf(q.toLowerCase()) === -1) return false;
        return true;
      });
      const totalOut = rows.reduce((s, r) => s + (Number(r.outstanding) || 0), 0);
      const totalPrev = rows.reduce((s, r) => s + (Number(r.previous_balance) || 0), 0);
      const worst = rows.filter(r => r.days_overdue >= 30).length;
      const remind = (r) => window.open(waLink(r.phone, `Dear ${r.full_name}, you have ${fmtMoney(r.outstanding)} outstanding across ${r.invoices} invoice(s), overdue ${r.days_overdue} days. Kindly clear it ${P.dun}. Thank you.`), '_blank');
      const suspend = (r) => Swal.fire({ icon:'question', title:'Suspend this connection?', showCancelButton:true, confirmButtonText:'Suspend' }).then(res => { if (res.isConfirmed) gsRun('tblUpdate', currentUser, 'customers', r.id, { connection_status:'suspended' }).then(() => { Swal.fire({ icon:'success', timer:1000, showConfirmButton:false }); mutate(); mutateLedger(); }); });
      const savePay = (form) => gsRun('tblInsert', currentUser, 'payments', form).then(r => { if (r && r.success) { setPay(null); Swal.fire({ icon:'success', title:'Payment recorded', timer:1300, showConfirmButton:false }); mutate(); mutateLedger(); } else Swal.fire({ icon:r && r.duplicate ? 'warning' : 'error', title:r && r.duplicate ? 'Duplicate not allowed' : 'Error', text:(r && r.message) || 'Failed' }); });
      const q2 = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
      const exportCsv = () => {
        const head = ['Code','Customer','Phone','Area','Package','Speed','Invoices','Previous','TotalBalance','DaysOverdue','Status'];
        const lines = [head.join(',')].concat(rows.map(r => [q2(r.customer_code), q2(r.full_name), q2(r.phone), q2(areaLabel(r.area_id)),
          q2(r.package), r.speed, r.invoices, r.previous_balance, r.outstanding, r.days_overdue, q2(r.connection_status)].join(',')));
        const url = URL.createObjectURL(new Blob([lines.join('\n')], { type:'text/csv' }));
        const a = document.createElement('a'); a.href = url; a.download = 'baqaya-' + (new Date()).toISOString().slice(0,10) + '.csv'; a.click(); URL.revokeObjectURL(url);
      };
      const printSheet = () => {
        const t = rows.reduce((s, r) => { s.previous += Number(r.previous_balance) || 0; s.outstanding += Number(r.outstanding) || 0; s.invoices += r.invoices || 0; return s; },
                              { previous:0, outstanding:0, invoices:0 });
        printArrears(rows.map(r => ({ ...r, area: areaLabel(r.area_id) })), {
          company: (lookups && lookups.company) || {},
          generated: new Date().toLocaleString('en-GB'),
          area: area ? areaLabel(area) : 'All Areas',
          month: new Date().toISOString().slice(0, 7),
          totals: { ...t, customers: rows.length }
        });
      };

      acRV.current = { refresh: () => mutate(), csv: exportCsv, print: printSheet };
      useEffect(() => {
        regRV({ onRefresh: () => acRV.current.refresh(), tools: [
          { label:'Print A4 (Baqaya)', icon:'fa-print', onClick: () => acRV.current.print() },
          { label:'CSV', icon:'fa-file-csv', onClick: () => acRV.current.csv() }
        ] });
        return () => regRV(null);
      }, []);

      return (
        <div className="data-section">
          {all === undefined ? <TableSkeleton rows={8} columns={8} /> : (
            <>
              <div className="kpi-strip">
                <div className="info-box"><div className="info-box-icon ib-red"><i className="fas fa-users"></i></div><div className="info-box-content"><div className="info-box-text">Customers in Arrears</div><div className="info-box-number">{rows.length}</div></div></div>
                <div className="info-box"><div className="info-box-icon ib-amber"><i className="fas fa-coins"></i></div><div className="info-box-content"><div className="info-box-text">Total Balance</div><div className="info-box-number">{fmtMoney(totalOut)}</div></div></div>
                <div className="info-box"><div className="info-box-icon ib-teal"><i className="fas fa-clock-rotate-left"></i></div><div className="info-box-content"><div className="info-box-text">Previous / Baqaya</div><div className="info-box-number">{fmtMoney(totalPrev)}</div></div></div>
                <div className="info-box"><div className="info-box-icon ib-navy"><i className="fas fa-hourglass-half"></i></div><div className="info-box-content"><div className="info-box-text">30+ Days Overdue</div><div className="info-box-number">{worst}</div></div></div>
              </div>
              <div className="filters-section"><div className="filters-grid">
                <div className="filter-group"><label><i className="fas fa-search"></i> Search</label><input className="filter-input" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Name / code / phone..." /></div>
                <div className="filter-group"><label><i className="fas fa-map-marker-alt"></i> Area</label><SearchableDropdown options={(lookups && lookups.areas) || []} value={area} onChange={setArea} placeholder="— All Areas —" /></div>
              </div></div>
              <div style={{ overflowX:'auto' }}>
                <table className="mini-table" style={{ width:'100%' }}>
                  <thead><tr><th>Code</th><th>Customer</th><th>Area</th><th>Package</th><th>Invoices</th><th>Previous</th><th>Total Balance</th><th>Overdue</th><th>Status</th><th>Actions</th></tr></thead>
                  <tbody>
                    {rows.length ? rows.map(r => (
                      <tr key={r.id} className={r.days_overdue >= 30 ? 'row-danger' : (r.days_overdue >= 7 ? 'row-warn' : '')}>
                        <td>{r.customer_code}</td>
                        <td><b>{r.full_name}</b><br /><span style={{ color:'#888', fontSize:12 }}>{r.phone}</span></td>
                        <td>{areaLabel(r.area_id)}</td>
                        <td>{r.package || '—'}{r.speed ? <span className="eb eb-neutral" style={{ marginLeft:5 }}>{r.speed} Mbps</span> : null}</td>
                        <td>{r.invoices}</td>
                        <td>{fmtMoney(r.previous_balance)}</td>
                        <td><b>{fmtMoney(r.outstanding)}</b></td>
                        <td><span className={`eb ${r.days_overdue >= 30 ? 'eb-bad' : (r.days_overdue >= 7 ? 'eb-warn' : 'eb-neutral')}`}>{r.days_overdue} days</span></td>
                        <td><span className={`eb ${r.connection_status === 'active' ? 'eb-ok' : (r.connection_status === 'suspended' ? 'eb-warn' : 'eb-bad')}`}>{r.connection_status}</span></td>
                        <td style={{ whiteSpace:'nowrap' }}>
                          <button className="action-icon" style={{ background:'#e7f8ec', color:'#1e7e34' }} title="WhatsApp reminder" onClick={() => remind(r)}><i className="fab fa-whatsapp"></i></button>
                          <button className="action-icon" title="Call" onClick={() => window.open('tel:' + telDigits(r.phone))}><i className="fas fa-phone"></i></button>
                          {canPay && <button className="action-icon edit-icon" title="Record Payment" onClick={() => setPay({ customer_id:r.id })}><i className="fas fa-money-bill-wave"></i></button>}
                          {canEditCust && r.connection_status === 'active' && <button className="action-icon delete-icon" title="Suspend" onClick={() => suspend(r)}><i className="fas fa-ban"></i></button>}
                        </td>
                      </tr>
                    )) : <tr><td colSpan={10} style={{ textAlign:'center', color:'#999', padding:'18px' }}>No outstanding customers 🎉</td></tr>}
                  </tbody>
                </table>
              </div>
            </>
          )}
          {pay && <EntityModal cfg={MODULES.payments} initial={pay} lookups={lookups} currentUser={currentUser} onClose={() => setPay(null)} onSave={savePay} />}
        </div>
      );
    }

    // ============== Users Management ==============
    function UsersView({ currentUser, perms, lookups }) {
      const canAdd = can(perms, 'users', 'a');
      const canEdit = can(perms, 'users', 'e');
      const canDel = can(perms, 'users', 'd');
      const { data: res, error, mutate } = useSWR('users:all', () => gsRun('getAllUsers', currentUser), { revalidateOnFocus: false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const loading = rows === undefined && !error;
      const [showModal, setShowModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);
      const [viewUser, setViewUser] = useState(null);
      const tableInstanceRef = useRef(null);
      const { register: regUV } = React.useContext(PageActionsCtx);
      const acUV = useRef({});
      const [filters, setFilters] = useState({ role: '', status: '', search: '' });

      useEffect(() => {
        if (res && !res.success) Swal.fire({ icon: 'error', title: 'Error', text: res.message || 'Failed to load users' });
      }, [res]);

      useEffect(() => {
        if (rows) initializeDataTable(rows);
        return () => {
          if (tableInstanceRef.current) {
            try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; } catch (e) {}
          }
        };
      }, [rows]);

      const initializeDataTable = (data) => {
        if (tableInstanceRef.current) {
          try { tableInstanceRef.current.destroy(); tableInstanceRef.current = null; $('#usersTable').empty(); } catch (e) {}
        }
        setTimeout(() => {
          try {
            const table = $('#usersTable').DataTable({
              data: data,
              destroy: true,
              columns: [
                { data: 'Username', title: 'Username' },
                { data: 'Email', title: 'Email' },
                { data: 'Role', title: 'Role' },
                { data: 'Status', title: 'Status', render: (d) => `<span class="status-badge ${d === 'Active' ? 'status-active' : 'status-inactive'}">${esc(d)}</span>` },
                { data: 'CreatedAt', title: 'Created', render: (d) => fmtDate(d) },
                { data: 'LastLogin', title: 'Last Login', render: (d) => (d && String(d).trim()) ? fmtDate(d) : '<span style="color:#999">Never</span>' },
                {
                  data: null, title: 'Actions', orderable: false,
                  render: () => `
                    <button class="action-icon detail-icon" data-action="view" title="View 360"><i class="fas fa-eye"></i></button>
                    ${canEdit ? `<button class="action-icon edit-icon" data-action="edit" title="Edit"><i class="fas fa-edit"></i></button>` : ''}
                    ${canEdit ? `<button class="action-icon" data-action="reset" title="Reset Password" style="background:#fff3e0;color:#c77800"><i class="fas fa-key"></i></button>` : ''}
                    ${canDel ? `<button class="action-icon delete-icon" data-action="delete" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
                  `
                }
              ],
              pageLength: 10,
              lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, "All"]],
              responsive: true,
              dom: 'Blfrtip',
              buttons: DT_BUTTONS,
              order: [[4, 'desc']]
            });

            $('#usersTable').off('click', '.action-icon');
            $('#usersTable').on('click', '.action-icon', function() {
              const action = $(this).data('action');
              const rowData = table.row($(this).parents('tr')).data();
              if (action === 'edit') { setEditingUser(rowData); setShowModal(true); }
              else if (action === 'delete') handleDelete(rowData);
              else if (action === 'view') setViewUser(rowData);
              else if (action === 'reset') handleReset(rowData);
            });

            tableInstanceRef.current = table;
          } catch (e) {
            console.error('DataTable initialization error:', e);
          }
        }, 150);
      };

      const applyFilters = () => {
        if (!tableInstanceRef.current) return;
        tableInstanceRef.current.columns().search('').draw();
        if (filters.role) tableInstanceRef.current.column(2).search(filters.role).draw(false);
        if (filters.status) tableInstanceRef.current.column(3).search(filters.status).draw(false);
        if (filters.search) tableInstanceRef.current.search(filters.search).draw(false);
        tableInstanceRef.current.draw();
      };

      const clearFilters = () => {
        setFilters({ role: '', status: '', search: '' });
        if (tableInstanceRef.current) tableInstanceRef.current.search('').columns().search('').draw();
      };

      useEffect(() => { if (tableInstanceRef.current && rows && rows.length) applyFilters(); }, [filters]);

      const handleSave = (userData) => {
        const p = editingUser ? gsRun('updateUser', editingUser.Username, userData, currentUser) : gsRun('addUser', userData, currentUser);
        return p.then((result) => {
            if (result.success) {
              setShowModal(false); setEditingUser(null);
              Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
              mutate(); swrMutate('dash:stats'); swrMutate('lookups');
            } else {
              Swal.fire({ icon: 'error', title: 'Error', text: result.message });
            }
          })
          .catch((err) => Swal.fire({ icon: 'error', title: 'Error', text: err.message }));
      };

      const handleReset = (user) => {
        Swal.fire({ icon:'warning', title:'Reset password', input:'text', inputLabel:`New password for ${user.Username}`, inputValue:'', showCancelButton:true, confirmButtonText:'Reset', inputValidator:(v) => (!v || v.length < 4) && 'At least 4 characters' })
          .then((res) => {
            if (res.isConfirmed) gsRun('resetUserPassword', currentUser, user.Username, res.value).then((r) => {
              Swal.fire({ icon:(r && r.success) ? 'success' : 'error', title:(r && r.success) ? 'Done' : 'Error', text:(r && r.message) || 'Failed' });
            }).catch((err) => Swal.fire({ icon:'error', title:'Error', text:err.message }));
          });
      };

      const handleDelete = (user) => {
        Swal.fire({ icon: 'warning', title: 'Delete User?', text: `Delete user "${user.Username}"? This cannot be undone.`, showCancelButton: true, confirmButtonColor: '#ea4335', confirmButtonText: 'Delete' })
          .then((result) => {
            if (result.isConfirmed) {
              gsRun('deleteUser', user.Username, currentUser).then((r) => {
                if (r.success) { Swal.fire({ icon: 'success', text: r.message, timer: 2000, showConfirmButton: false }); mutate(); swrMutate('dash:stats'); }
                else Swal.fire({ icon: 'error', title: 'Error', text: r.message });
              }).catch((err) => Swal.fire({ icon: 'error', title: 'Error', text: err.message }));
            }
          });
      };

      acUV.current = { openAdd: () => { setEditingUser(null); setShowModal(true); }, refresh: () => mutate() };
      useEffect(() => {
        regUV({ canAdd, onAdd: () => acUV.current.openAdd(), onRefresh: () => acUV.current.refresh() });
        return () => regUV(null);
      }, [canAdd]);

      return (
        <div className="data-section">
          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear</button>
              </div>
              <div className="filters-grid">
                <div className="filter-group">
                  <label><i className="fas fa-search"></i> Search</label>
                  <input type="text" value={filters.search} onChange={(e) => setFilters({...filters, search: e.target.value})} placeholder="Search users..." className="filter-input" />
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-user-tag"></i> Role</label>
                  <SearchableDropdown options={['super_admin','admin','accountant','collector']} value={filters.role} onChange={(v) => setFilters({...filters, role: v})} placeholder="— All Roles —" />
                </div>
                <div className="filter-group">
                  <label><i className="fas fa-check-circle"></i> Status</label>
                  <SearchableDropdown options={['Active','Inactive']} value={filters.status} onChange={(v) => setFilters({...filters, status: v})} placeholder="— All Status —" />
                </div>
              </div>
            </div>
          )}

          {loading && <TableSkeleton rows={8} columns={6} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="usersTable" className="display" style={{width: '100%'}}></table>
          </div>

          {showModal && <UserModal user={editingUser} lookups={lookups} onClose={() => { setShowModal(false); setEditingUser(null); }} onSave={handleSave} />}
          {viewUser && <UserView user={viewUser} currentUser={currentUser} lookups={lookups} onClose={() => setViewUser(null)} />}
        </div>
      );
    }

    // ============== User View (Profile / Activity / Permissions) ==============
    function UserView({ user, currentUser, lookups, onClose }) {
      useEsc(onClose);
      const [tab, setTab] = useState('profile');
      const { data } = useSWR('uact:' + user.Username, () => gsRun('getUserActivity', currentUser, user.Username), { revalidateOnFocus:false });
      const acts = (data && data.success) ? data.data : (data ? [] : undefined);
      const areaLabel = (id) => { const a = ((lookups && lookups.areas) || []).find(o => String(o.id) === String(id)); return a ? a.label : (id || '—'); };
      const PAGE_LABELS = ABOUT_GRANTS;
      const grantsFor = (roleKey) => {
        const idx = { admin:0, accountant:1, collector:2 }[roleKey];
        return Object.keys(PAGE_LABELS).map(pg => {
          const g = roleKey === 'super_admin' ? 'vaed' : ((PAGE_LABELS[pg].split('|')[idx] || '-'));
          return { pg, g };
        });
      };
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{ maxWidth:'860px' }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header"><h3><i className="fas fa-user"></i> {user.Name || user.Username} <span style={{ fontSize:13, opacity:0.8 }}>({user.Role})</span></h3><button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button></div>
            <div className="modal-body">
              <div className="kpi-strip">
                <div className="info-box"><div className="info-box-icon ib-navy"><i className="fas fa-user-shield"></i></div><div className="info-box-content"><div className="info-box-text">Role</div><div className="info-box-number" style={{ fontSize:15 }}>{user.Role}</div></div></div>
                <div className="info-box"><div className={`info-box-icon ${user.Status === 'Active' ? 'ib-green' : 'ib-grey'}`}><i className="fas fa-circle-check"></i></div><div className="info-box-content"><div className="info-box-text">Status</div><div className="info-box-number" style={{ fontSize:15 }}>{user.Status}</div></div></div>
                <div className="info-box"><div className="info-box-icon ib-blue"><i className="fas fa-clock"></i></div><div className="info-box-content"><div className="info-box-text">Last Login</div><div className="info-box-number" style={{ fontSize:13 }} dangerouslySetInnerHTML={{ __html: (user.LastLogin && String(user.LastLogin).trim()) ? fmtDate(user.LastLogin) : 'Never' }} /></div></div>
              </div>
              <div className="c360-tabs">
                {[['profile','Profile','fa-id-card'],['activity','Activity','fa-clock-rotate-left'],['perms','Permissions','fa-user-lock']].map(([k, l, ic]) => <button key={k} className={`c360-tab ${tab === k ? 'active' : ''}`} onClick={() => setTab(k)}><i className={`fas ${ic}`}></i> {l}</button>)}
              </div>
              <div style={{ overflowX:'auto', marginTop:12 }}>
                {tab === 'profile' && (
                  <div className="detail-summary">
                    {[['Username',user.Username],['Name',user.Name],['Email',user.Email],['Phone',user.Phone],['Role',user.Role],['Status',user.Status],['Area',areaLabel(user.AreaId)]].map(([l, v]) => (
                      <div className="ds-item" key={l}><span className="ds-label">{l}</span><span className="ds-value">{(v === '' || v == null) ? '—' : String(v)}</span></div>
                    ))}
                    <div className="ds-item"><span className="ds-label">Created</span><span className="ds-value" dangerouslySetInnerHTML={{ __html: fmtDate(user.CreatedAt) }} /></div>
                  </div>
                )}
                {tab === 'activity' && (acts === undefined ? <TableSkeleton rows={5} columns={3} /> : (
                  <table className="mini-table" style={{ width:'100%' }}>
                    <thead><tr><th>When</th><th>Action</th><th>Details</th></tr></thead>
                    <tbody>{acts.length ? acts.map((a, i) => <tr key={i}><td dangerouslySetInnerHTML={{ __html: fmtDate(a.Timestamp) }} /><td>{a.Action}</td><td>{a.Details}</td></tr>) : <tr><td colSpan={3} className="ac-empty">No activity</td></tr>}</tbody>
                  </table>
                ))}
                {tab === 'perms' && (
                  <table className="mini-table" style={{ width:'100%' }}>
                    <thead><tr><th>Page</th><th>Access</th></tr></thead>
                    <tbody>{grantsFor(user.Role).map(({ pg, g }) => (
                      <tr key={pg}><td style={{ textTransform:'capitalize' }}>{(PAGE_META[pg] || {}).label || (ABOUT_EXTRA_LABELS[pg] || pg)}</td>
                        <td>{(!g || g === '-') ? <span style={{ color:'#bbb' }}>— no access</span> : ['v','a','e','d'].filter(p => g.indexOf(p) !== -1).map(p => <span key={p} className="eb eb-ok" style={{ marginRight:4 }}>{ {v:'Read',a:'Create',e:'Edit',d:'Delete'}[p] }</span>)}</td></tr>
                    ))}</tbody>
                  </table>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============== User Modal ==============
    function UserModal({ user, lookups, onClose, onSave }) {
      const [formData, setFormData] = useState({
        Username: user?.Username || '', Email: user?.Email || '', Password: '',
        Role: user?.Role || 'collector', Status: user?.Status || 'Active',
        Name: user?.Name || '', Phone: user?.Phone || '', AreaId: user?.AreaId || ''
      });
      const [saving, setSaving] = useState(false);
      const setV = (k, v) => setFormData({ ...formData, [k]: v });
      const handleSubmit = (e) => { e.preventDefault(); setSaving(true); Promise.resolve(onSave(formData)).finally(() => setSaving(false)); };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className="fas fa-user-edit"></i> {user ? 'Edit' : 'Add'} User</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <form onSubmit={handleSubmit}>
                <div className="form-grid">
                  <div className="form-group"><label>Username *</label><input type="text" value={formData.Username} onChange={(e) => setV('Username', e.target.value)} required disabled={!!user} /></div>
                  <div className="form-group"><label>Email *</label><input type="email" value={formData.Email} onChange={(e) => setV('Email', e.target.value)} required /></div>
                  <div className="form-group"><label>Password {user ? '(Leave blank to keep current)' : '*'}</label><input type="password" value={formData.Password} onChange={(e) => setV('Password', e.target.value)} required={!user} autoComplete="new-password" /></div>
                  <div className="form-group"><label>Full Name</label><input type="text" value={formData.Name} onChange={(e) => setV('Name', e.target.value)} /></div>
                  <div className="form-group"><label>Phone</label><input type="text" value={formData.Phone} onChange={(e) => setV('Phone', e.target.value)} /></div>
                  <div className="form-group"><label>Role</label><SearchableDropdown options={['super_admin','admin','accountant','collector']} value={formData.Role} onChange={(v) => setV('Role', v)} /></div>
                  <div className="form-group"><label>Status</label><SearchableDropdown options={['Active','Inactive']} value={formData.Status} onChange={(v) => setV('Status', v)} /></div>
                  <div className="form-group"><label>Area</label><SearchableDropdown options={(lookups && lookups.areas) || []} value={formData.AreaId} onChange={(v) => setV('AreaId', v)} placeholder="— None —" /></div>
                </div>
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============== My Account ==============
    function AccountView({ currentUser, currentEmail, role }) {
      const [formData, setFormData] = useState({ Email: currentEmail || '', CurrentPassword: '', NewPassword: '', ConfirmPassword: '' });
      const [saving, setSaving] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (formData.NewPassword && formData.NewPassword !== formData.ConfirmPassword) {
          Swal.fire({ icon: 'error', title: 'Error', text: 'New passwords do not match!' });
          return;
        }
        setSaving(true);
        gsRun('updateMyAccount', currentUser, formData).then((result) => {
          setSaving(false);
          if (result.success) {
            Swal.fire({ icon: 'success', title: 'Success!', text: result.message, timer: 2000, showConfirmButton: false });
            setFormData({ ...formData, CurrentPassword: '', NewPassword: '', ConfirmPassword: '' });
          } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        }).catch((err) => { setSaving(false); Swal.fire({ icon: 'error', title: 'Error', text: err.message }); });
      };

      return (
        <div className="profile-section">
          <div className="profile-header">
            <div className="profile-avatar">{currentUser.charAt(0).toUpperCase()}</div>
            <div className="profile-info"><h2>{currentUser}</h2><p>{role} Account</p></div>
          </div>
          <form onSubmit={handleSubmit}>
            <div className="form-group"><label>Username (Cannot be changed)</label><input type="text" value={currentUser} disabled style={{background: '#f5f5f5', cursor: 'not-allowed'}} /></div>
            <div className="form-group"><label>Email *</label><input type="email" value={formData.Email} onChange={(e) => setFormData({...formData, Email: e.target.value})} required /></div>
            <hr style={{margin: '25px 0', border: 'none', borderTop: '2px solid #e0e0e0'}} />
            <h3 style={{color: 'var(--navy-primary)', marginBottom: '18px', fontSize: '18px'}}><i className="fas fa-lock"></i> Change Password</h3>
            <div className="form-group"><label>Current Password *</label><input type="password" value={formData.CurrentPassword} onChange={(e) => setFormData({...formData, CurrentPassword: e.target.value})} required autoComplete="current-password" /></div>
            <div className="form-group"><label>New Password (Leave blank to keep current)</label><input type="password" value={formData.NewPassword} onChange={(e) => setFormData({...formData, NewPassword: e.target.value})} autoComplete="new-password" /></div>
            <div className="form-group"><label>Confirm New Password</label><input type="password" value={formData.ConfirmPassword} onChange={(e) => setFormData({...formData, ConfirmPassword: e.target.value})} autoComplete="new-password" /></div>
            <div className="form-actions">
              <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Update Account</>}</button>
            </div>
          </form>
        </div>
      );
    }

    // ============== Settings Page ==============
    function SystemSettingsCard({ currentUser }) {
      const { data, mutate } = useSWR('sys:settings', () => gsRun('getSettings', currentUser), { revalidateOnFocus:false });
      const cfg = (data && data.success) ? data.data : null;
      const [form, setForm] = useState(null);
      const [saving, setSaving] = useState(false);
      const [busy, setBusy] = useState(false);
      useEffect(() => { if (cfg && !form) setForm({ business_type:cfg.business_type || 'isp', company_name:cfg.company_name || '', whatsapp_number:cfg.whatsapp_number || '', support_phone:cfg.support_phone || '', currency:cfg.currency || 'INR', phone_country_code:cfg.phone_country_code || '91', invoice_prefix:cfg.invoice_prefix || 'INV', late_fee_pct:cfg.late_fee_pct || '0' }); }, [cfg]);
      if (!form) return (
        <div className="lte-card" style={{ marginBottom:20 }}>
          <div className="lte-card-head"><i className="fas fa-sliders"></i> Company / System Settings</div>
          <div className="lte-card-body"><TableSkeleton rows={3} columns={2} /></div>
        </div>
      );
      const set = (k, v) => setForm({ ...form, [k]: v });
      const save = () => { setSaving(true); gsRun('saveSettings', currentUser, form).then(r => { setSaving(false); if (r && r.success) {
          if (form.business_type !== (cfg.business_type || 'isp')) { writeSession({ businessType: form.business_type }); Swal.fire({ icon:'success', title:'Saved', text:'Reloading with your new business type…', timer:1300, showConfirmButton:false }).then(() => window.location.reload()); return; }
          PHONE_CC = String(form.phone_country_code || '91').replace(/\D/g, '') || '91'; writeSession({ phoneCode: PHONE_CC });
          Swal.fire({ icon:'success', title:'Saved', timer:1300, showConfirmButton:false }); mutate(); swrMutate('lookups'); } else Swal.fire({ icon:'error', title:'Error', text:(r && r.message) || 'Failed' }); }).catch(() => setSaving(false)); };
      const recalc = () => { setBusy(true); gsRun('recalcAllBalances', currentUser)
        .then(r => { Swal.fire({ icon:(r && r.success) ? 'success' : 'error', title:(r && r.success) ? 'Balances rebuilt' : 'Error', text:(r && r.message) || 'Failed', timer:(r && r.success) ? 1800 : undefined, showConfirmButton:!(r && r.success) });
          LEDGER_KEYS.forEach(k => swrMutate(k)); })
        .catch(e => Swal.fire({ icon:'error', title:'Error', text:e.message }))
        .finally(() => setBusy(false)); };
      const fields = [ ['company_name','Company Name','fa-building'], ['whatsapp_number','WhatsApp Number','fa-comment-dots'], ['support_phone','Support Phone','fa-phone'], ['currency','Currency','fa-coins'], ['phone_country_code','WhatsApp Country Code (91 = India)','fa-globe'], ['invoice_prefix','Invoice Prefix','fa-hashtag'], ['late_fee_pct','Late Fee %','fa-percent'] ];
      return (
        <div className="lte-card" style={{ marginBottom:20 }}>
          <div className="lte-card-head"><i className="fas fa-sliders"></i> Company / System Settings</div>
          <div className="lte-card-body">
            <div className="form-grid">
              <div className="form-group"><label><i className="fas fa-briefcase"></i> Type of Business</label>
                <SearchableDropdown options={Object.keys(BIZ).map(k => ({ id:k, label:BIZ[k].label }))} value={form.business_type} onChange={(v) => set('business_type', v)} /></div>
              {fields.map(([k, l, ic]) => (
                <div className="form-group" key={k}><label><i className={`fas ${ic}`}></i> {l}</label><input value={form[k]} onChange={(e) => set(k, e.target.value)} /></div>
              ))}
            </div>
            <div className="form-actions">
              <button className="btn btn-primary" disabled={saving} onClick={save}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save Settings</>}</button>
              <button className="btn btn-secondary" disabled={busy} onClick={recalc} title="Rebuild every invoice balance and customer balance from scratch">
                {busy ? <><i className="fas fa-spinner fa-spin"></i> Rebuilding…</> : <><i className="fas fa-scale-balanced"></i> Recalculate Balances</>}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function SettingsView({ currentUser, role, onSettingsUpdate }) {
      const [uploading, setUploading] = useState(false);
      const [customColors, setCustomColors] = useState({ palette: 'UI 7', primary: '#2B2F36', secondary: '#4A4F57', bg: '#F7F7F7', accent: '#D4AF37', onAccent: '#222222', text: '#1A1A1A' });
      const fileInputRef = useRef(null);

      const { data: settingsRes } = useSWR('settings:' + currentUser, () => gsRun('getUserSettings', currentUser), { revalidateOnFocus: false });
      useEffect(() => {
        const cc = settingsRes && settingsRes.success && settingsRes.settings && settingsRes.settings.customColors;
        if (cc) { try { setCustomColors(JSON.parse(cc)); } catch (e) {} }
      }, [settingsRes]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { Swal.fire({ icon: 'error', title: 'Error', text: 'Please select an image file' }); return; }
        const reader = new FileReader();
        reader.onload = (event) => {
          setUploading(true);
          gsRun('uploadProfileImage', event.target.result, file.name, currentUser).then((result) => {
            setUploading(false);
            if (result.success) {
              gsRun('updateUserSettings', currentUser, { profileImage: result.fileUrl }).then((r) => {
                if (r.success) { Swal.fire({ icon: 'success', title: 'Success!', text: 'Profile image updated!', timer: 2000, showConfirmButton: false }); onSettingsUpdate(); }
              });
            } else Swal.fire({ icon: 'error', title: 'Error', text: result.message });
          }).catch((err) => { setUploading(false); Swal.fire({ icon: 'error', title: 'Error', text: err.message }); });
        };
        reader.readAsDataURL(file);
      };

      const saveColors = (cc, toast) => {
        applyThemeVars(cc);
        try { const s = JSON.parse(localStorage.getItem('userSession') || '{}'); s.customColors = JSON.stringify(cc); localStorage.setItem('userSession', JSON.stringify(s)); } catch (e) {}
        gsRun('updateUserSettings', currentUser, { customColors: JSON.stringify(cc) }).then((result) => {
          if (result && result.success) { Swal.fire({ icon:'success', title:'Applied!', text:toast, timer:1600, showConfirmButton:false }); onSettingsUpdate(); }
        });
      };

      const selectPalette = (p) => {
        const cc = { palette:p.id, primary:p.primary, secondary:p.secondary, bg:p.bg, accent:p.accent, onAccent:p.onAccent, text:'#1A1A1A' };
        setCustomColors(cc); saveColors(cc, p.id + ' — ' + p.name);
      };
      const handleColorChange = (type, color) => { const cc = { ...customColors, [type]: color, palette: 'Custom' }; setCustomColors(cc); applyThemeVars(cc); };
      const applyColors = () => saveColors({ ...customColors, palette: customColors.palette || 'Custom' }, 'Custom colors applied');
      const resetToDefaultColors = () => selectPalette(paletteById('UI 7'));

      return (
        <div className="data-section">
          <h2><i className="fas fa-cog"></i> Settings</h2>
          <SystemSettingsCard currentUser={currentUser} />
          <div className="settings-info-message">
            <i className="fas fa-info-circle" style={{marginRight: '6px'}}></i>
            <strong>Note:</strong> Your profile picture and theme colors are personal — changes apply only to your own account.
          </div>

          <div style={{marginTop: '25px'}}>
            <h3 style={{marginBottom: '18px', color: 'var(--navy-primary)', fontSize: '17px'}}><i className="fas fa-image"></i> Profile Picture</h3>
            <div style={{marginBottom: '18px'}}>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} style={{display: 'none'}} />
              <button className="btn btn-primary" onClick={() => fileInputRef.current.click()} disabled={uploading}>
                {uploading ? <><i className="fas fa-spinner fa-spin"></i> Uploading...</> : <><i className="fas fa-upload"></i> Upload Picture</>}
              </button>
              <p style={{marginTop: '10px', fontSize: '13px', color: '#666'}}>Upload a new profile picture. Recommended size: 200x200px</p>
            </div>
          </div>

          <hr style={{margin: '25px 0', border: 'none', borderTop: '2px solid #e0e0e0'}} />

          <div style={{marginTop: '25px'}}>
            <h3 style={{marginBottom: '18px', color: 'var(--navy-primary)', fontSize: '17px'}}><i className="fas fa-palette"></i> Color Customization</h3>
            <p style={{ fontSize:13, color:'#666', marginBottom:14 }}>Pick a ready-made theme — it applies instantly and loads first every time you open the app.</p>
            <div className="palette-grid">
              {PALETTES.map(p => (
                <button key={p.id} type="button" className={`palette-card ${customColors.palette === p.id ? 'selected' : ''}`} onClick={() => selectPalette(p)} title={p.id + ' — ' + p.name}>
                  <div className="palette-swatch" style={{ background:p.bg }}>
                    <span className="ps-bar" style={{ background:p.primary }}></span>
                    <span className="ps-bar" style={{ background:p.secondary }}></span>
                    <span className="ps-dot" style={{ background:p.accent }}></span>
                  </div>
                  <div className="palette-meta"><span className="palette-id">{p.id}</span><span className="palette-name">{p.name}</span></div>
                  {customColors.palette === p.id && <i className="fas fa-circle-check palette-check"></i>}
                </button>
              ))}
            </div>

            <h4 style={{ fontSize:14, fontWeight:600, margin:'20px 0 10px', color:'var(--navy-primary)' }}><i className="fas fa-sliders"></i> Fine-tune (optional)</h4>
            <div className="form-grid">
              {[['primary','Primary Color'],['accent','Accent Color'],['text','Text Color']].map(([k, l]) => (
                <div className="form-group" key={k}><label>{l}</label><input type="color" value={customColors[k]} onChange={(e) => handleColorChange(k, e.target.value)} style={{width: '100%', height: '48px', cursor: 'pointer'}} /></div>
              ))}
            </div>

            <div className="color-preview-section">
              <h4 style={{fontSize: '14px', fontWeight: '600', marginBottom: '5px', color: 'var(--navy-primary)'}}><i className="fas fa-eye"></i> Live Preview</h4>
              <p style={{fontSize: '12px', color: '#666', marginBottom: '10px'}}>See how your colors look together</p>
              <div className="color-preview-grid">
                {[['primary','Primary'],['accent','Accent'],['text','Text']].map(([k, l]) => (
                  <div className="color-preview-item" key={k}>
                    <div className="color-preview-box" style={{backgroundColor: customColors[k]}}></div>
                    <div className="color-preview-label">{l}</div>
                    <div className="color-preview-value">{customColors[k]}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{display: 'flex', gap: '10px', marginTop: '18px', flexWrap: 'wrap'}}>
              <button className="btn btn-success" onClick={applyColors}><i className="fas fa-check"></i> Apply Colors</button>
              <button className="btn btn-secondary" onClick={resetToDefaultColors}><i className="fas fa-undo"></i> Reset</button>
            </div>
          </div>
        </div>
      );
    }

    // ============== Activity Logs View ==============
    function LogsView({ currentUser }) {
      const { data, error } = useSWR('logs:all', () => gsRun('getLogs', currentUser), { revalidateOnFocus: false });
      const rows = data ? (data.success ? data.data : []) : undefined;
      const loading = rows === undefined && !error;
      const tableRef = useRef(null);
      const [filters, setFilters] = useState({ user:'', action:'', from:'', to:'' });
      const users = rows ? Array.from(new Set(rows.map(r => r.User).filter(Boolean))).sort() : [];
      const actions = rows ? Array.from(new Set(rows.map(r => r.Action).filter(Boolean))).sort() : [];

      useEffect(() => {
        if (rows) initTable(rows);
        return () => { delete _dateFilters['logsTable']; if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; } catch (e) {} } };
      }, [rows]);

      useEffect(() => {
        const t = tableRef.current; if (!t) return;
        t.columns().search('');
        if (filters.user) t.column(1).search('^' + escapeRegex(filters.user) + '$', true, false);
        if (filters.action) t.column(2).search('^' + escapeRegex(filters.action) + '$', true, false);
        _dateFilters['logsTable'] = { field:'Timestamp', from:filters.from || '', to:filters.to || '' };
        t.draw();
      }, [filters]);

      const clearFilters = () => { setFilters({ user:'', action:'', from:'', to:'' }); delete _dateFilters['logsTable']; if (tableRef.current) tableRef.current.columns().search('').draw(); };

      const initTable = (data) => {
        if (tableRef.current) { try { tableRef.current.destroy(); tableRef.current = null; $('#logsTable').empty(); } catch (e) {} }
        setTimeout(() => {
          try {
            tableRef.current = $('#logsTable').DataTable({
              data, destroy: true,
              columns: [
                { data: 'Timestamp', title: 'Time', render: (d) => {
                    if (!d) return '<span style="color:#999;">N/A</span>';
                    try { const dt = new Date(d); if (isNaN(dt.getTime())) return esc(d);
                      return dt.toLocaleString('en-US', { year:'numeric', month:'short', day:'2-digit', hour:'2-digit', minute:'2-digit' }); }
                    catch (e) { return esc(d); }
                  } },
                { data: 'User', title: 'User' },
                { data: 'Action', title: 'Action', render: (d, type) => {
                    if (type !== 'display') return d;
                    const s = String(d).toLowerCase();
                    const cls = /fail|delet|remov/.test(s) ? 'eb-bad' : (/add|success|generat|reset|paid|updat/.test(s) ? 'eb-ok' : 'eb-neutral');
                    return `<span class="eb ${cls}">${esc(d)}</span>`;
                  } },
                { data: 'Details', title: 'Details' }
              ],
              pageLength: 10, lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, 'All']],
              responsive: true, order: [], dom: 'Blfrtip',
              buttons: [
                { extend: 'csv', text: '<i class="fas fa-file-csv"></i> CSV' },
                { extend: 'pdf', text: '<i class="fas fa-file-pdf"></i> PDF' },
                { extend: 'print', text: '<i class="fas fa-print"></i> Print' }
              ]
            });
          } catch (e) { console.error('Logs table error:', e); }
        }, 150);
      };

      return (
        <div className="data-section">
          {!loading && (
            <div className="filters-section">
              <div className="filters-header"><h3><i className="fas fa-filter"></i> Filters</h3><button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear</button></div>
              <div className="filters-grid">
                <div className="filter-group"><label><i className="fas fa-user"></i> User</label><SearchableDropdown options={users} value={filters.user} onChange={(v) => setFilters({ ...filters, user:v })} placeholder="— All Users —" /></div>
                <div className="filter-group"><label><i className="fas fa-bolt"></i> Action</label><SearchableDropdown options={actions} value={filters.action} onChange={(v) => setFilters({ ...filters, action:v })} placeholder="— All Actions —" /></div>
                <div className="filter-group"><label><i className="fas fa-calendar-days"></i> Date Range</label><div style={{ display:'flex', gap:6 }}><input type="date" className="filter-input" title="From" value={filters.from} onChange={(e) => setFilters({ ...filters, from:e.target.value })} /><input type="date" className="filter-input" title="To" value={filters.to} onChange={(e) => setFilters({ ...filters, to:e.target.value })} /></div></div>
              </div>
            </div>
          )}
          {loading && <TableSkeleton rows={8} columns={4} />}
          <div style={{ display: loading ? 'none' : 'block' }}>
            <table id="logsTable" className="display" style={{ width: '100%' }}></table>
          </div>
        </div>
      );
    }

    // ============== Roles & Permissions Matrix ==============
    function PermissionsMatrixView({ currentUser }) {
      const { data: res, isLoading, mutate } = useSWR('rbac:matrix', () => gsRun('getRbacMatrix', currentUser), { revalidateOnFocus: false });
      const data = res && res.success ? res : null;
      const PERMS = [['v', 'View'], ['a', 'Add'], ['e', 'Edit'], ['d', 'Delete']];

      const toggle = (roleKey, pageKey, perm, cur, locked) => {
        if (locked) return;
        const nv = cur ? 0 : 1;
        mutate((d) => {
          if (!d || !d.perms) return d;
          const perms = { ...d.perms }, rp = { ...(perms[roleKey] || {}) }, cell = { ...(rp[pageKey] || { v:0, a:0, e:0, d:0 }) };
          cell[perm] = nv;
          if (perm === 'v' && !nv) { cell.a = 0; cell.e = 0; cell.d = 0; }
          if (perm !== 'v' && nv) cell.v = 1;
          rp[pageKey] = cell; perms[roleKey] = rp; return { ...d, perms };
        }, false);
        gsRun('toggleRbac', roleKey, pageKey, perm, nv, currentUser)
          .then((r) => { if (!r || !r.success) { Swal.fire({ icon:'error', title:'Error', text:(r && r.message) || 'Failed' }); mutate(); } })
          .catch(() => mutate());
      };

      if (isLoading) return <div className="data-section"><TableSkeleton rows={8} columns={4} /></div>;
      if (!data) return <NoAccessView />;
      const groups = data.pages.map((p) => p.group).filter((g, i, a) => a.indexOf(g) === i);
      const tableMinW = 200 + data.roles.length * 120;

      return (
        <div className="data-section">
          <p style={{ color:'#666', fontSize:'13px', marginBottom:'12px' }}>
            <i className="fas fa-info-circle"></i> Toggle V·A·E·D per role × page. Changes save instantly. Super Admin (owner) is locked to full access.
          </p>
          <div className="rbac-wrap">
            <table className="rbac-table" style={{ minWidth: tableMinW + 'px' }}>
              <thead><tr>
                <th className="rbac-pagecol">Page</th>
                {data.roles.map((r) => (
                  <th key={r.key}><span className="rbac-rolehead" style={{ background:r.color }}>{r.label}</span><div className="rbac-perm-legend">V·A·E·D</div></th>
                ))}
              </tr></thead>
              <tbody>
                {groups.map((grp) => (
                  <React.Fragment key={grp}>
                    <tr className="rbac-grouprow"><td className="rbac-pagecol">{grp}</td>{data.roles.map((r) => <td key={r.key}></td>)}</tr>
                    {data.pages.filter((p) => p.group === grp).map((pg) => (
                      <tr key={pg.key}>
                        <td className="rbac-pagecol">{pg.label}</td>
                        {data.roles.map((r) => {
                          const cell = (data.perms[r.key] && data.perms[r.key][pg.key]) || { v:0, a:0, e:0, d:0 };
                          const locked = !!r.is_super;
                          return (
                            <td key={r.key}><div className="rbac-cell">
                              {PERMS.map(([pk, label]) => (
                                <button key={pk} title={label} className={`rbac-dot${cell[pk] ? ' on' : ''}${locked ? ' locked' : ''}`} disabled={locked}
                                  onClick={() => toggle(r.key, pg.key, pk, cell[pk], locked)}>{pk.toUpperCase()}</button>
                              ))}
                            </div></td>
                          );
                        })}
                      </tr>
                    ))}
                  </React.Fragment>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ============== Shared format + render helpers ==============
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const escapeRegex = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const fmtMoney = (v) => 'Rs ' + (Number(v) || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    const fmtDate = (d) => {
      if (d === null || d === undefined || d === '' || d === 'N/A') return '<span style="color:#999">—</span>';
      try {
        const date = (typeof d === 'number') ? new Date((d - 25569) * 86400 * 1000) : new Date(d);
        if (!date || isNaN(date.getTime())) return '<span style="color:#999">—</span>';
        const y = date.getFullYear(); if (y < 1900 || y > 2100) return '<span style="color:#999">—</span>';
        return date.toLocaleString('en-US', { month: 'short' }) + ' ' + String(date.getDate()).padStart(2, '0') + ', ' + y;
      } catch (e) { return '<span style="color:#999">—</span>'; }
    };
    const badgeClass = (v) => {
      v = String(v).toLowerCase();
      if (['active','paid','resolved','closed','won','reconciled','cleared','in_stock','approved','success'].indexOf(v) !== -1) return 'eb-ok';
      if (['suspended','partial','pending','in_progress','contacted','quoted','negotiating','promised','returned','open','warning','medium'].indexOf(v) !== -1) return 'eb-warn';
      if (['disconnected','unpaid','overdue','lost','dropped','damaged','retired','disputed','rejected','danger','refused','no_answer','urgent','high'].indexOf(v) !== -1) return 'eb-bad';
      return 'eb-neutral';
    };
    const badgeHtml = (v) => (v === '' || v == null) ? '<span style="color:#999">—</span>' : `<span class="eb ${badgeClass(v)}">${esc(String(v).replace(/_/g,' '))}</span>`;
    const balHtml = (v) => {
      const n = Number(v) || 0;
      if (n > 0.009) return `<span class="bal ${n >= 5000 ? 'bal-bad' : 'bal-due'}">${fmtMoney(n)}</span>`;
      if (n < -0.009) return `<span class="bal bal-cr">${fmtMoney(-n)} adv</span>`;
      return '<span class="bal bal-clear">Clear</span>';
    };
    const colRenderer = (c, lookups) => (d, type, row) => {
      if (c.k === 'lk') {
        const f = ((lookups && lookups[c.lk]) || []).find(o => String(o.id) === String(d));
        const lbl = f ? String(f.label) : ((d === '' || d == null) ? '' : String(d));
        if (type && type !== 'display') return lbl;
        return lbl === '' ? '<span style="color:#999">—</span>' : esc(lbl);
      }
      if (c.k === 'lkf') {
        const f = ((lookups && lookups[c.lk]) || []).find(o => String(o.id) === String(d));
        const v = f ? f[c.f] : null;
        if (type && type !== 'display') return v == null ? '' : v;
        return v == null ? '<span style="color:#999">—</span>' : esc(String(v)) + (c.suf || '');
      }
      if (type && type !== 'display') return (d == null ? '' : d);
      if (c.k === 'bal') return balHtml(d);
      if (c.k === 'badge') return badgeHtml(d);
      if (c.k === 'bool')  return (d == 1 || d === '1') ? '<span class="eb eb-ok">Yes</span>' : '<span class="eb eb-neutral">No</span>';
      if (c.k === 'money') return fmtMoney(d);
      if (c.k === 'date')  return fmtDate(d);
      if (c.k === 'overdue') {
        if (!row || (Number(row.balance) || 0) <= 0.009 || !d) return '<span style="color:#999">—</span>';
        const days = Math.round((Date.now() - new Date(String(d).slice(0, 10)).getTime()) / 86400000);
        if (isNaN(days)) return '<span style="color:#999">—</span>';
        return days > 0 ? `<span class="eb ${days >= 30 ? 'eb-bad' : 'eb-warn'}">${days}d overdue</span>` : `<span class="eb eb-ok">${-days}d left</span>`;
      }
      return (d === '' || d == null) ? '<span style="color:#999">—</span>' : esc(d);
    };
    const telDigits = (p) => String(p || '').replace(/[^0-9]/g, '');
    const waLink = (phone, msg) => {
      let d = telDigits(phone);
      if (d.startsWith('00')) d = d.slice(2);
      else if (d.startsWith('0')) d = PHONE_CC + d.slice(1);
      else if (d.length === 10) d = PHONE_CC + d;   // local mobile number without 0 (e.g. 98xxxxxxxx)
      return 'https://wa.me/' + d + (msg ? '?text=' + encodeURIComponent(msg) : '');
    };
    const faPrefix = (icon) => (icon === 'fa-whatsapp' || icon === 'fa-facebook' || icon === 'fa-instagram') ? 'fab' : 'fas';
    const AI_CLS = { 'fa-whatsapp':'ai-wa', 'fa-phone':'ai-call', 'fa-phone-volume':'ai-call', 'fa-money-bill-wave':'ai-pay', 'fa-file-invoice-dollar':'ai-pay', 'fa-hand-holding-dollar':'ai-pay', 'fa-coins':'ai-pay', 'fa-bolt':'ai-warn', 'fa-power-off':'ai-danger', 'fa-ban':'ai-danger', 'fa-print':'ai-info', 'fa-eye':'detail-icon' };
    const custPhone = (lk, id) => { const c = ((lk && lk.customers) || []).find(o => String(o.id) === String(id)); return c ? (c.phone || '') : ''; };
    const custName  = (lk, id) => { const c = ((lk && lk.customers) || []).find(o => String(o.id) === String(id)); return c ? (c.name || c.label || 'Customer') : 'Customer'; };

    function rowActions(cfg, row, ctx) {
      const out = [];
      if (ctx.detailEnabled) out.push({ k:'detail', icon:'fa-eye', label:'Details', primary:true, cls:'detail-icon' });
      if (ctx.canEdit) out.push({ k:'edit', icon:'fa-edit', label:'Edit', primary:true, cls:'edit-icon' });
      (cfg.actions || []).forEach(a => {
        if (a.gate && !can(ctx.perms, a.gate.page || cfg.page, a.gate.perm)) return;
        if (!a.gate && a.perm && !can(ctx.perms, cfg.page, a.perm)) return;
        if (a.when && !a.when(row)) return;
        out.push(a);
      });
      if (ctx.canDel) out.push({ k:'delete', icon:'fa-trash', label:'Delete', danger:true, cls:'delete-icon' });
      return out;
    }
    function rowActionsHtml(cfg, row, ctx) {
      const acts = rowActions(cfg, row, ctx);
      if (!acts.length) return '<span style="color:#999;">—</span>';
      const btn = (a) => `<button class="action-icon ${a.cls || AI_CLS[a.icon] || (a.danger ? 'delete-icon' : 'ai-info')}" data-action="${a.k}" title="${esc(a.label)}"><i class="${faPrefix(a.icon)} ${a.icon}"></i></button>`;
      if (acts.length <= 3) return '<div class="row-actions">' + acts.map(btn).join('') + '</div>';
      return '<div class="row-actions">' + acts.slice(0, 2).map(btn).join('')
        + '<span class="ra-extra">' + acts.slice(2).map(btn).join('') + '</span>'
        + '<button class="action-icon ra-more" data-action="__more" title="More"><i class="fas fa-ellipsis"></i></button>'
        + '</div>';
    }

    const DT_BUTTONS = [
      { extend:'csv',   text:'<i class="fas fa-file-csv"></i> CSV',   exportOptions:{ columns:':not(:last-child)' } },
      { extend:'pdf',   text:'<i class="fas fa-file-pdf"></i> PDF',   exportOptions:{ columns:':not(:last-child)' } },
      { extend:'print', text:'<i class="fas fa-print"></i> Print',   exportOptions:{ columns:':not(:last-child)' } }
    ];

    const EMPTY_LOOKUPS = { areas:[], packages:[], customers:[], invoices:[], vendors:[], banks:[], users:[], company:{} };
    function useLookups(currentUser) {
      const { data } = useSWR('lookups', () => gsRun('getLookups', currentUser), { revalidateOnFocus:false });
      return (data && data.success) ? data.data : EMPTY_LOOKUPS;
    }

    const _escStack = [];
    function useEsc(onClose) {
      useEffect(() => {
        const token = {};
        _escStack.push(token);
        const h = (e) => { if (e.key === 'Escape' && _escStack[_escStack.length - 1] === token) onClose(); };
        document.addEventListener('keydown', h);
        return () => { document.removeEventListener('keydown', h); const i = _escStack.indexOf(token); if (i >= 0) _escStack.splice(i, 1); };
      }, []);
    }

    const _dateFilters = {};
    if (!window.__dateFilterReg && window.jQuery && $.fn && $.fn.dataTable) {
      window.__dateFilterReg = true;
      $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
        const f = _dateFilters[settings.nTable.id];
        if (!f || (!f.from && !f.to)) return true;
        const row = settings.aoData && settings.aoData[dataIndex] && settings.aoData[dataIndex]._aData;
        const v = (row && typeof row === 'object') ? row[f.field] : null; if (!v) return true;

        if (f.from && day < f.from) return false;

    // ============== SearchableDropdown ==============
    function SearchableDropdown({ options, value, onChange, placeholder, disabled, allowCustom }) {
      const [open, setOpen] = useState(false);
      const [q, setQ] = useState('');
      const ref = useRef(null);
      const opts = (options || []).map(o => (typeof o === 'object' && o !== null) ? o : { id:o, label:String(o) });
      let sel = opts.find(o => String(o.id) === String(value));
      if (!sel && allowCustom && value) sel = { id:value, label:String(value) };
      useEffect(() => {
        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setQ(''); } };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);
      const filtered = opts.filter(o => String(o.label).toLowerCase().includes(q.toLowerCase())).slice(0, 300);
      const custom = allowCustom && q.trim() && !opts.some(o => String(o.label).toLowerCase() === q.trim().toLowerCase());
      const pick = (v) => { onChange(v); setOpen(false); setQ(''); };
      return (
        <div className={`sdrop ${disabled ? 'disabled' : ''} ${open ? 'open' : ''}`} ref={ref}>
          <div className="sdrop-control" onClick={() => !disabled && setOpen(!open)}>
            <span className={sel ? '' : 'sdrop-ph'}>{sel ? sel.label : (placeholder || 'Select...')}</span>
            <i className={`fas fa-chevron-${open ? 'up' : 'down'}`}></i>
          </div>
          {open && (
            <div className="sdrop-menu">
              <div className="sdrop-search">
                <i className="fas fa-search"></i>
                <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search..." onClick={(e) => e.stopPropagation()} />
              </div>
              <div className="sdrop-options">
                {placeholder !== undefined && <div className="sdrop-opt" onClick={() => pick('')}>{placeholder}</div>}
                {custom && <div className="sdrop-opt" onClick={() => pick(q.trim())}><i className="fas fa-plus"></i> Use “{q.trim()}”</div>}
                {filtered.length ? filtered.map(o => (
                  <div key={o.id} className={`sdrop-opt ${String(o.id) === String(value) ? 'active' : ''}`} onClick={() => pick(o.id)}>{o.label}</div>
                )) : (!custom && <div className="sdrop-empty">No matches</div>)}
              </div>
            </div>
          )}
        </div>
      );
    }

    function ChildCell({ c, row, lookups }) {
      const d = row[c.d];
      if (c.k === 'lk') {
        const f = ((lookups && lookups[c.lk]) || []).find(o => String(o.id) === String(d));
        return <span>{f ? f.label : ((d === '' || d == null) ? '—' : String(d))}</span>;

      return <span>{(d === '' || d == null) ? '—' : String(d)}</span>;

    // ============== Detail Drawer ==============
    function DetailDrawer({ det, parent, currentUser, perms, lookups, onClose }) {
      useEsc(onClose);
      const canAdd = can(perms, det.page, 'a');
      const canDel = can(perms, det.page, 'a');
      const { data, mutate } = useSWR('child:' + det.childKey + ':' + parent.id, () => gsRun('childRead', currentUser, det.childKey, parent.id), { revalidateOnFocus:false });
      const kids = (data && data.success) ? data.data : (data ? [] : undefined);
      const [showForm, setShowForm] = useState(false);
      const childCfg = { title: det.title, icon: det.icon, fields: det.fields };

      const addChild = (form) => gsRun('childInsert', currentUser, det.childKey, parent.id, form).then(r => {
        if (r && r.success) { setShowForm(false); Swal.fire({ icon:'success', title:'Saved', timer:1200, showConfirmButton:false }); mutate(); }
        else Swal.fire({ icon:'error', title:'Error', text:(r && r.message) || 'Failed' });
      }).catch(e => Swal.fire({ icon:'error', title:'Error', text:e.message }));

      const delChild = (row) => Swal.fire({ icon:'warning', title:'Remove?', text:'Remove this ' + det.title.toLowerCase() + '?', showCancelButton:true, confirmButtonColor:'#ea4335', confirmButtonText:'Remove' })
        .then(res => { if (res.isConfirmed) gsRun('childDelete', currentUser, det.childKey, row.id).then(r => {
          if (r && r.success) { Swal.fire({ icon:'success', timer:1000, showConfirmButton:false }); mutate(); }
          else Swal.fire({ icon:'error', title:'Error', text:(r && r.message) || 'Failed' });
        }); });

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" style={{ maxWidth:'860px' }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className={`fas ${det.icon}`}></i> {det.title}s</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              <div className="detail-summary">
                {det.summary.map(s => (
                  <div className="ds-item" key={s.d}><span className="ds-label">{s.t}</span><span className="ds-value"><ChildCell c={s} row={parent} lookups={lookups} /></span></div>

                    <thead><tr>{det.cols.map(c => <th key={c.d}>{c.t}</th>)}{canDel && <th>Actions</th>}</tr></thead>

                        <tr key={row.id}>
                          {det.cols.map(c => <td key={c.d}><ChildCell c={c} row={row} lookups={lookups} /></td>)}
                          {canDel && <td><button className="action-icon delete-icon" onClick={() => delChild(row)}><i className="fas fa-trash"></i></button></td>}

                    </tbody>

                </div>

                              <td dangerouslySetInnerHTML={{ __html: fmtDate(iv.due_date) }} />

                    ) : <div className="ac-empty"><i className="fas fa-circle-check" style={{ color:'#1e7e34' }}></i> No pending invoices — account is clear.</div>)}
                    {tab === 'timeline' && (

                    {tab === 'invoices' && mini(d.invoices, [{d:'invoice_number',t:'#'},{d:'billing_month',t:'Month'},{d:'previous_balance',t:'Previous',k:'money'},{d:'total',t:'Invoice',k:'money'},{d:'paid_amount',t:'Paid',k:'money'},{d:'balance',t:'Balance',k:'money'},{d:'due_date',t:'Due',k:'date'},{d:'status',t:'Status',k:'badge'}])}
                    {tab === 'payments' && mini(d.payments, [{d:'receipt_number',t:'Receipt #'},{d:'slip_code',t:'Slip'},{d:'amount',t:'Amount',k:'money'},{d:'payment_method',t:'Method',k:'badge'},{d:'reference_number',t:'Payment ID'},{d:'payment_date',t:'Date',k:'date'},{d:'collected_by',t:'By',k:'lk',lk:'users'}])}
                    {tab === 'complaints' && mini(d.complaints, [{d:'ticket_number',t:'#'},{d:'subject',t:'Subject'},{d:'priority',t:'Priority',k:'badge'},{d:'status',t:'Status',k:'badge'}])}
                    {tab === 'equipment' && mini(d.equipment, [{d:'type',t:'Type',k:'badge'},{d:'serial',t:'Serial'},{d:'status',t:'Status',k:'badge'}])}

      if (!data.success) return shell(null, <><i className="fas fa-triangle-exclamation"></i> {data.message || 'Could not load dues'}</>);

      return (

              <span style={{ opacity:.85, fontSize:12, marginLeft:8 }}><i className="fas fa-phone"></i> {c.phone || '—'}</span></span>
          </div>
          {p && (
            <div className="dues-pkg">
              <i className="fas fa-box"></i> <b>{p.name}</b>
              {p.speed > 0 && <span className="spd"><i className="fas fa-gauge-high"></i> {p.speed} Mbps</span>}
              <span><i className="fas fa-tag"></i> {fmtMoney(p.price)} / {p.cycle}</span>
              {c.area && <span><i className="fas fa-map-marker-alt"></i> {c.area}</span>}
              {c.due_day ? <span><i className="fas fa-calendar-day"></i> Due day {c.due_day}</span> : null}
            </div>
          )}
          <div className="dues-grid">
            <div className="dues-cell"><span className="dl">Previous / Baqaya</span><span className="dv">{fmtMoney(d.previous_balance)}</span></div>
            <div className="dues-cell"><span className="dl">This Month · {d.billing_month}</span><span className="dv">{fmtMoney(d.month_charges)}</span></div>
            <button type="button" className="dues-cell tot" style={{ border:'none', cursor:'pointer', font:'inherit' }} title="Click to fill the full payable amount"
              onClick={() => onPick && onPick({ id:'', balance:d.total_payable })}>
              <span className="dl">Total Payable <i className="fas fa-hand-pointer"></i></span><span className="dv">{fmtMoney(d.total_payable)}</span>
            </button>
          </div>
          <div className="dues-inv">
            {d.open_invoices.length ? d.open_invoices.map(iv => (
              <button type="button" key={iv.id} className="dues-inv-row" onClick={() => onPick && onPick(iv)}>
                <span><b>{iv.invoice_number}</b> <span style={{ color:'#8a94a0' }}>· {iv.billing_month} · due {iv.due_date}</span>
                  {iv.days_overdue > 0 && <span className={`eb ${iv.days_overdue >= 30 ? 'eb-bad' : 'eb-warn'}`} style={{ marginLeft:6 }}>{iv.days_overdue}d late</span>}</span>
                <span><b style={{ color:'#b02a23' }}>{fmtMoney(iv.balance)}</b> <i className="fas fa-arrow-right-to-bracket" style={{ marginLeft:6, color:'#8a94a0' }}></i></span>
              </button>
            )) : <div className="dues-empty"><i className="fas fa-circle-check"></i> No unpaid invoices — this payment goes to the running balance.</div>}
          </div>
          {d.recent_payments.length > 0 && (
            <div style={{ padding:'8px 14px', fontSize:12, color:'#8a94a0', borderTop:'1px solid #eef1f6' }}>
              <i className="fas fa-clock-rotate-left"></i> Last payment: {d.recent_payments[0].receipt_number}
              {d.recent_payments[0].slip_code ? ' · slip ' + d.recent_payments[0].slip_code : ''} · {fmtMoney(d.recent_payments[0].amount)} · {d.recent_payments[0].payment_date}
            </div>
