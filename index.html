    // ============== Entity Field / Modal ==============
    function EntityField({ f, value, onChange, lookups, form }) {
      let input;
      let opts = f.t === 'lk' ? (lookups[f.lk] || []) : (typeof f.o === 'function' ? f.o(form) : f.o);
      if (f.t === 'lk' && f.filterBy && form && form[f.filterBy]) opts = opts.filter(o => o[f.filterBy] === undefined || String(o[f.filterBy]) === String(form[f.filterBy]));
      if (f.t === 'area') input = <textarea value={value} onChange={(e) => onChange(e.target.value)} rows={3}></textarea>;
      else if (f.t === 'num') input = <input type="number" step="any" value={value} onChange={(e) => onChange(e.target.value)} />;
      else if (f.t === 'date') input = <input type="date" value={value ? String(value).slice(0,10) : ''} onChange={(e) => onChange(e.target.value)} />;
      else if (f.t === 'month') input = <input type="month" value={value ? String(value).slice(0,7) : ''} onChange={(e) => onChange(e.target.value)} />;
      else if (f.t === 'combo') input = <SearchableDropdown options={opts || []} value={value} onChange={onChange} placeholder="— Select or type —" allowCustom />;
      else if (f.t === 'sel' || f.t === 'lk') input = <SearchableDropdown options={opts} value={value} onChange={onChange} placeholder={f.req ? undefined : '— None —'} />;
      else input = <input type={f.t === 'email' ? 'email' : 'text'} value={value} onChange={(e) => onChange(e.target.value)} />;
      return (
        <div className={`form-group ${f.full ? 'full-row' : ''}`}>
          <label>{f.l}{f.req ? ' *' : ''}</label>
          {input}
          {f.hint && <span style={{ fontSize:11.5, color:'#8a94a0', display:'block', marginTop:4 }}><i className="fas fa-circle-info"></i> {f.hint}</span>}
        </div>
      );
    }

    // ============== Invoice calculator ==============
    const localToday = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const num0 = (v) => Number(v) || 0;
    const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
    const pctOf = (v, base) => { const t = String(v == null ? '' : v).trim(); return /%$/.test(t) ? r2(base * num0(t.replace('%', '')) / 100) : r2(num0(t)); };
    const invoiceMath = (f) => { const amount = r2(num0(f.amount)), discount = pctOf(f.discount, amount), net = r2(amount - discount), tax = pctOf(f.tax, net); return { amount, discount, net, tax, total: r2(net + tax) }; };
    function InvoiceCalc({ form }) {
      const m = invoiceMath(form);
      const isPct = (v) => /%$/.test(String(v || '').trim());
      const row = (l, v) => <div style={{ display:'flex', justifyContent:'space-between', padding:'6px 0', borderBottom:'1px dashed #e3e6eb', fontSize:14 }}><span>{l}</span><span>{fmtMoney(v)}</span></div>;
      return (
        <div style={{ background:'#f8f9fb', border:'1px solid #e3e6eb', borderRadius:10, padding:'10px 14px', margin:'4px 0 14px' }}>
          <div style={{ fontSize:12, fontWeight:700, textTransform:'uppercase', letterSpacing:.5, color:'#7a8794', marginBottom:4 }}><i className="fas fa-calculator"></i> Invoice calculation</div>
          {row('Amount', m.amount)}
          {row('− Discount' + (isPct(form.discount) ? ' (' + String(form.discount).trim() + ')' : ''), m.discount)}
          <div style={{ display:'flex', justifyContent:'space-between', padding:'6px 0', borderBottom:'1px dashed #e3e6eb', fontWeight:700 }}><span>Net amount</span><span>{fmtMoney(m.net)}</span></div>
          {row('+ Tax / GST' + (isPct(form.tax) ? ' (' + String(form.tax).trim() + ')' : ''), m.tax)}
          <div style={{ display:'flex', justifyContent:'space-between', padding:'8px 0 2px', fontWeight:800, fontSize:18, color:'var(--navy-primary)' }}><span>Total</span><span>{fmtMoney(m.total)}</span></div>
        </div>
      );
    }

    function EntityModal({ cfg, initial, lookups, currentUser, onClose, onSave }) {
      useEsc(onClose);
      const blank = {};
      const isNewRec = !(initial && initial.id);
      cfg.fields.forEach(f => {
        let v = (initial && initial[f.n] !== undefined && initial[f.n] !== '') ? initial[f.n] : (f.def !== undefined ? f.def : '');
        if (isNewRec && f.auto && (v === '' || v == null)) v = f.t === 'month' ? localToday().slice(0, 7) : localToday();
        blank[f.n] = v;
      });
      const isInv = cfg.key === 'invoices';
      const pkPrice = (id) => { const pk = ((lookups && lookups.packages) || []).find(o => String(o.id) === String(id)); return pk ? pk.price : null; };
      const custPkg = (id) => { const c = ((lookups && lookups.customers) || []).find(o => String(o.id) === String(id)); return c ? c.package_id : ''; };
      if (isInv && isNewRec && blank.customer_id && !blank.package_id) blank.package_id = custPkg(blank.customer_id) || '';
      if (isInv && isNewRec && blank.package_id && !num0(blank.amount) && pkPrice(blank.package_id) != null) blank.amount = pkPrice(blank.package_id);
      const [form, setForm] = useState(blank);
      const [saving, setSaving] = useState(false);
      const set = (n, v) => setForm(prev => {
        const next = { ...prev, [n]: v };
        if (isInv) {   // customer → their plan, plan → its price (only if amount not typed by hand)
          if (n === 'customer_id' && !prev.package_id) { const pid = custPkg(v); if (pid) { next.package_id = pid; if (!num0(prev.amount) && pkPrice(pid) != null) next.amount = pkPrice(pid); } }
          if (n === 'package_id') { const pr = pkPrice(v), old = pkPrice(prev.package_id); if (pr != null && (!num0(prev.amount) || num0(prev.amount) === num0(old))) next.amount = pr; }
        }
        return next;
      });
      const submit = (e) => {
        e.preventDefault();
        const missing = cfg.fields.filter(f => f.req && (form[f.n] === '' || form[f.n] == null));
        if (missing.length) { Swal.fire({ icon:'warning', title:'Required fields', text:'Please fill: ' + missing.map(m => m.l).join(', ') }); return; }
        setSaving(true);
        let out = form;
        if (isInv) { const m = invoiceMath(form); out = { ...form, amount: m.amount, discount: m.discount, tax: m.tax }; }
        Promise.resolve(onSave(out)).finally(() => setSaving(false));
      };
      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className={`modal ${cfg.panel === 'dues' ? 'modal-wide' : ''}`} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3><i className={`fas ${cfg.icon}`}></i> {(initial && initial.id) ? 'Edit' : 'Add'} {cfg.title}</h3>
              <button className="close-btn" onClick={onClose}><i className="fas fa-times"></i></button>
            </div>
            <div className="modal-body">
              {cfg.panel === 'dues' && currentUser && (
                <CustomerDuesPanel currentUser={currentUser} customerId={form.customer_id}
                  onPick={(iv) => setForm(prev => ({ ...prev, invoice_id: iv.id || '', amount: iv.balance }))} />
              )}
              <form onSubmit={submit}>
                <div className="form-grid">
                  {cfg.fields.map(f => <EntityField key={f.n} f={f} form={form} value={form[f.n]} onChange={(v) => set(f.n, v)} lookups={lookups} />)}
                </div>
                {isInv && <InvoiceCalc form={form} />}
                <div className="form-actions">
                  <button type="submit" className="btn btn-primary" disabled={saving}>{saving ? <><i className="fas fa-spinner fa-spin"></i> Saving...</> : <><i className="fas fa-save"></i> Save</>}</button>
                  <button type="button" className="btn btn-secondary" onClick={onClose}><i className="fas fa-times"></i> Cancel</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ============== Entity View (generic list page) ==============
    function EntityView({ cfg, currentUser, perms, lookups }) {
      const canAdd = can(perms, cfg.page, 'a'), canEdit = can(perms, cfg.page, 'e'), canDel = can(perms, cfg.page, 'd');
      const det = DETAILS[cfg.key];
      const detailEnabled = !!det && can(perms, det.page, 'v');
      const { data: res, error, mutate } = useSWR(cfg.page + ':all', () => gsRun('tblRead', currentUser, cfg.key), { revalidateOnFocus:false });
      const rows = res ? (res.success ? res.data : []) : undefined;
      const loading = rows === undefined && !error;
      const [showModal, setShowModal] = useState(false);
      const [editing, setEditing] = useState(null);
      const [detailRow, setDetailRow] = useState(null);
      const [quickForm, setQuickForm] = useState(null);
      const [totals, setTotals] = useState(null);
      const [filters, setFilters] = useState({});
      const tRef = useRef(null);
      const builtKeyRef = useRef(null);
      const timerRef = useRef(null);
      const lookupsRef = useRef(lookups);
      lookupsRef.current = lookups;
      const { register } = React.useContext(PageActionsCtx);
      const acRef = useRef({});
      const tableId = 'tbl_' + cfg.key;
      const moneyCols = cfg.cols.map((c, i) => ({ c, i })).filter(x => x.c.k === 'money' || x.c.k === 'bal');

      useEffect(() => { if (res && !res.success) Swal.fire({ icon:'error', title:'Error', text:res.message || 'Failed to load' }); }, [res]);

      useEffect(() => {
        if (!rows) return;
        if (tRef.current && builtKeyRef.current === cfg.key) {
          try { tRef.current.clear(); tRef.current.rows.add(rows); tRef.current.draw(false); }
          catch (e) { buildTable(rows); }
        } else buildTable(rows);
      }, [rows, cfg.key]);

      useEffect(() => () => {
        delete _dateFilters[tableId];
        if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        if (tRef.current) { try { tRef.current.destroy(); tRef.current = null; } catch (e) {} }
      }, []);

      useEffect(() => {
        if (tRef.current) { try { tRef.current.rows().invalidate().draw(false); } catch (e) {} }
      }, [lookups]);

      const buildTable = (data) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        if (tRef.current) { try { tRef.current.destroy(); tRef.current = null; } catch (e) {} }
        try { $('#' + tableId).empty(); } catch (e) {}
        builtKeyRef.current = cfg.key;
        const ctx = { canEdit, canDel, detailEnabled, perms };
        timerRef.current = setTimeout(() => {
          timerRef.current = null;
          try {
            const columns = cfg.cols.map(c => ({ data: c.d, defaultContent: '', title: c.t, render: (d, type, row) => colRenderer(c, lookupsRef.current)(d, type, row) }));
            columns.push({ data:null, title:'Actions', orderable:false, className:'dt-actions', responsivePriority:1, render: (d, t, row) => rowActionsHtml(cfg, row, ctx) });
            const table = $('#' + tableId).DataTable({
              data, destroy:true, columns,
              pageLength:10, lengthMenu:[[10,25,50,100,-1],[10,25,50,100,'All']],
              responsive:true, dom:'Blfrtip', buttons:DT_BUTTONS, order:cfg.order || [[0,'desc']],
              createdRow: cfg.rowClass ? (tr, row) => { const c = cfg.rowClass(row); if (c) tr.classList.add(c); } : undefined
            });
            if (moneyCols.length) {
              const upd = () => { const t = {}; moneyCols.forEach(({ c, i }) => { t[c.d] = table.column(i, { search:'applied' }).data().toArray().reduce((a, b) => a + (Number(b) || 0), 0); }); setTotals(t); };
              table.on('draw', upd); upd();
            }
            $('#' + tableId).off('click', '.action-icon').on('click', '.action-icon', function() {
              const action = $(this).data('action');
              if (action === '__more') {
                const ra = $(this).closest('.row-actions').toggleClass('open');
                $(this).find('i').attr('class', ra.hasClass('open') ? 'fas fa-xmark' : 'fas fa-ellipsis');
                return;
              }
              runAction(action, table.row($(this).closest('tr')).data());
            });
            tRef.current = table;
          } catch (e) { console.error('DataTable error:', e); }
        }, 60);
      };

      useEffect(() => {
        const t = tRef.current; if (!t) return;
        t.columns().search(''); t.search('');
        const applied = {};
        (cfg.filters || []).forEach(f => {
          if (f.k === 'daterange') return;
          const v = filters[f.n]; if (!v || applied[f.n]) return;
          if (f.k === 'search') t.search(v);
          else { const idx = cfg.cols.findIndex(c => c.d === f.n); if (idx >= 0) { t.column(idx).search('^' + escapeRegex(v) + '$', true, false); applied[f.n] = 1; } }
        });
        if (cfg.pipeline) { const pf = cfg.pipeline.field, pv = filters[pf]; if (pv && !applied[pf]) { const idx = cfg.cols.findIndex(c => c.d === pf); if (idx >= 0) t.column(idx).search('^' + escapeRegex(pv) + '$', true, false); } }
        const drf = (cfg.filters || []).find(f => f.k === 'daterange');
        if (drf) { const dv = filters[drf.n] || {}; _dateFilters[tableId] = { field:drf.field, from:dv.from || '', to:dv.to || '' }; }
        t.draw();
      }, [filters]);

      const clearFilters = () => { setFilters({}); delete _dateFilters[tableId]; if (tRef.current) { tRef.current.search('').columns().search('').draw(); } };
      const refresh = (money) => {
        const p = mutate(); swrRefresh('dash:stats');
        if (['customers','areas','packages','invoices','vendors','banks'].indexOf(cfg.key) !== -1) swrRefresh('lookups');
        if (money !== false && ['payments','invoices'].indexOf(cfg.key) !== -1) mutateLedger();
        return p;
      };

      const handleSave = (formData) => {
        const p = editing ? gsRun('tblUpdate', currentUser, cfg.key, editing.id, formData) : gsRun('tblInsert', currentUser, cfg.key, formData);
        return p.then(r => {
          if (r && r.success) {
            setShowModal(false); setEditing(null);
            toastOk(r.message);
            refresh();
            if (cfg.key === 'customers') mutateLedger();
          } else Swal.fire({ icon:r && r.duplicate ? 'warning' : 'error', title:r && r.duplicate ? 'Duplicate not allowed' : 'Error', text:(r && r.message) || 'Failed' });
        }).catch(err => Swal.fire({ icon:'error', title:'Error', text:err.message }));
      };

      const doDelete = (row) => {
        Swal.fire({ icon:'warning', title:'Delete?', text:`Delete this ${cfg.title} record? This cannot be undone.`, showCancelButton:true, confirmButtonColor:'#ea4335', confirmButtonText:'Delete' })
          .then(result => {
            if (result.isConfirmed) gsRun('tblDelete', currentUser, cfg.key, row.id).then(r => {
              if (r && r.success) { Swal.fire({ icon:'success', text:r.message, timer:1500, showConfirmButton:false }); refresh(); }
              else Swal.fire({ icon:'error', title:'Error', text:(r && r.message) || 'Failed' });
            }).catch(err => Swal.fire({ icon:'error', title:'Error', text:err.message }));
          });
      };

      const runAction = (k, row) => {
        if (k === 'edit') { setEditing(row); setShowModal(true); return; }
        if (k === 'delete') { doDelete(row); return; }
        if (k === 'detail') { setDetailRow(row); return; }
        const a = (cfg.actions || []).find(x => x.k === k); if (!a) return;
        const lk = lookupsRef.current;
        if (a.type === 'wa')  { const ph = telDigits(a.phone(row, lk)); if (!ph) { Swal.fire({ icon:'info', title:'No phone number', text:'This record has no phone number on file.' }); return; } window.open(waLink(a.phone(row, lk), a.msg ? a.msg(row, lk) : ''), '_blank'); return; }
        if (a.type === 'tel') { const ph = telDigits(a.phone(row, lk)); if (!ph) { Swal.fire({ icon:'info', title:'No phone number', text:'This record has no phone number on file.' }); return; } window.open('tel:' + ph); return; }
        if (a.type === 'form') { setQuickForm({ module: a.module, initial: a.prefill ? a.prefill(row, lk) : {} }); return; }
        if (a.type === 'print') { printDoc(a.doc, row, lk); return; }
        if (a.type === 'set') {
          const apply = () => {
            mutate(d => (d && d.data) ? { ...d, data: d.data.map(x => String(x.id) === String(row.id) ? { ...x, [a.field]: a.value } : x) } : d, false);
            toastOk(a.toast || 'Updated');
            return gsRun('tblUpdate', currentUser, cfg.key, row.id, { [a.field]: a.value }).then(r => {
              if (r && r.success) refresh(false);
              else { mutate(); Swal.fire({ icon:'error', title:'Not saved', text:(r && r.message) || 'Failed' }); }
            }).catch(err => { mutate(); Swal.fire({ icon:'error', title:'Not saved', text:err.message }); });
          };
          a.confirm ? Swal.fire({ icon:'question', title:a.confirm, showCancelButton:true, confirmButtonText:'Yes' }).then(res => { if (res.isConfirmed) apply(); }) : apply();
          return;
        }
        if (a.type === 'fn') {
          const args = a.args ? a.args(row) : [row.id];
          const call = () => gsRun(a.fn, currentUser, ...args).then(r => {
            if (r && r.success) { Swal.fire({ icon:'success', title:'Done', text:r.message || a.toast || '', timer:1800, showConfirmButton:false }); refresh(); (a.also || []).forEach(key => swrMutate(key)); }
            else Swal.fire({ icon:'error', title:'Error', text:(r && r.message) || 'Failed' });
          }).catch(err => Swal.fire({ icon:'error', title:'Error', text:err.message }));
          a.confirm ? Swal.fire({ icon:'question', title:a.confirm, text:a.confirmText || '', showCancelButton:true, confirmButtonText:'Yes' }).then(res => { if (res.isConfirmed) call(); }) : call();
          return;
        }
      };

      const runTool = (t) => {
        const exec = (arg) => gsRun(t.fn, currentUser, ...(arg !== undefined ? [arg] : [])).then(r => {
          Swal.fire({ icon:(r && r.success) ? 'success' : 'error', title:(r && r.success) ? 'Done' : 'Error', text:(r && r.message) || 'Failed' });
          refresh(); (t.also || []).forEach(k => swrMutate(k));
        }).catch(err => Swal.fire({ icon:'error', title:'Error', text:err.message }));
        if (t.ask === 'month') Swal.fire({ input:'text', inputLabel:'Billing month (YYYY-MM)', inputValue:(new Date()).toISOString().slice(0,7), showCancelButton:true, confirmButtonText:t.label }).then(res => { if (res.isConfirmed) exec(res.value); });
        else exec();
      };

      const saveQuick = (form) => gsRun('tblInsert', currentUser, quickForm.module, form).then(r => {
        if (r && r.success) { setQuickForm(null); Swal.fire({ icon:'success', title:'Saved', timer:1300, showConfirmButton:false }); swrMutate(MODULES[quickForm.module].page + ':all'); refresh(); }
        else Swal.fire({ icon:r && r.duplicate ? 'warning' : 'error', title:r && r.duplicate ? 'Duplicate not allowed' : 'Error', text:(r && r.message) || 'Failed' });
      }).catch(err => Swal.fire({ icon:'error', title:'Error', text:err.message }));

      const pf = cfg.pipeline ? cfg.pipeline.field : null;

      const toolList = (cfg.tools || []).filter(t => !t.gate || can(perms, t.gate.page || cfg.page, t.gate.perm));
      acRef.current = { openAdd: () => { setEditing(null); setShowModal(true); }, refresh, runTool };
      useEffect(() => {
        register({
          canAdd,
          onAdd: () => acRef.current.openAdd(),
          onRefresh: () => acRef.current.refresh(),
          tools: toolList.map(t => ({ label:t.label, icon:t.icon, onClick: () => acRef.current.runTool(t) }))
        });
        return () => register(null);
      }, [cfg.key, canAdd]);

      return (
        <div className="data-section">
          {!loading && rows && cfg.kpis && (
            <div className="kpi-strip">
              {cfg.kpis.map((kpi, i) => {
                const active = kpi.filter && (filters[kpi.filter.field] || '') === kpi.filter.value;
                return (
                  <div key={i} className={`info-box ${active ? 'kpi-active' : ''}`} onClick={() => kpi.filter && setFilters({ ...filters, [kpi.filter.field]: active ? '' : kpi.filter.value })}>
                    <div className={`info-box-icon ${kpi.color || 'ib-navy'}`}><i className={`fas ${kpi.icon}`}></i></div>
                    <div className="info-box-content"><div className="info-box-text">{kpi.label}</div><div className="info-box-number">{kpi.calc(rows)}</div></div>
                  </div>
                );
              })}
            </div>
          )}

          {!loading && rows && cfg.pipeline && (
            <div className="pipeline-stages">
              {[{ v:'', label:'All', color:'#33383d' }].concat(cfg.pipeline.stages).map(s => {
                const count = s.v === '' ? rows.length : rows.filter(r => String(r[pf]) === s.v).length;
                const active = (filters[pf] || '') === s.v;
                return (
                  <div key={s.v || 'all'} className={`pipeline-stage ${active ? 'active' : ''} ${count === 0 && s.v !== '' ? 'pipeline-empty' : ''}`} style={{ background: s.color || '#5f6b7a' }}
                    onClick={() => setFilters({ ...filters, [pf]: active ? '' : s.v })}>
                    <span className="pipeline-stage-name">{s.label}</span><span className="pipeline-stage-count">({count})</span>
                  </div>
                );
              })}
            </div>
          )}

          {!loading && (
            <div className="filters-section">
              <div className="filters-header">
                <h3><i className="fas fa-filter"></i> Filters</h3>
                <button className="btn btn-secondary btn-sm" onClick={clearFilters}><i className="fas fa-times-circle"></i> Clear</button>
              </div>
              <div className="filters-grid">
                {(cfg.filters || []).map(f => (
                  <div className="filter-group" key={f.n}>
                    <label><i className={`fas ${f.k === 'search' ? 'fa-search' : (f.k === 'daterange' ? 'fa-calendar-days' : 'fa-angle-right')}`}></i> {f.l}</label>
                    {f.k === 'search'
                      ? <input className="filter-input" value={filters[f.n] || ''} onChange={(e) => setFilters({ ...filters, [f.n]: e.target.value })} placeholder={'Search ' + cfg.title.toLowerCase() + 's...'} />
                      : f.k === 'daterange'
                      ? <div style={{ display:'flex', gap:6 }}>
                          <input type="date" className="filter-input" title="From" value={(filters[f.n] || {}).from || ''} onChange={(e) => setFilters({ ...filters, [f.n]: { ...(filters[f.n] || {}), from:e.target.value } })} />
                          <input type="date" className="filter-input" title="To" value={(filters[f.n] || {}).to || ''} onChange={(e) => setFilters({ ...filters, [f.n]: { ...(filters[f.n] || {}), to:e.target.value } })} />
                        </div>
                      : f.k === 'lk'
                      ? <SearchableDropdown options={((lookups && lookups[f.lk]) || []).map(o => ({ id:o.label, label:o.label }))} value={filters[f.n] || ''} onChange={(v) => setFilters({ ...filters, [f.n]: v })} placeholder="— All —" />
                      : <SearchableDropdown options={f.o} value={filters[f.n] || ''} onChange={(v) => setFilters({ ...filters, [f.n]: v })} placeholder="— All —" />}
                  </div>
                ))}
              </div>
            </div>
          )}

          {loading && <TableSkeleton rows={8} columns={cfg.cols.length + 1} />}
          {!loading && rows && rows.length === 0 && (
            <div className="empty-state">
              <i className={`fas ${cfg.icon}`}></i>
              <p>No {cfg.title.toLowerCase()}s yet.</p>
              {canAdd && <button className="btn btn-success" onClick={() => { setEditing(null); setShowModal(true); }}><i className="fas fa-plus"></i> Add your first {cfg.title}</button>}
            </div>
          )}
          <div style={{ display: (loading || (rows && rows.length === 0)) ? 'none' : 'block' }}>
            <table id={tableId} className="display" style={{ width:'100%' }}></table>
          </div>
          {!loading && rows && rows.length > 0 && moneyCols.length > 0 && totals && (
            <div className="totals-bar">
              <span><i className="fas fa-calculator"></i> Filtered totals:</span>
              {moneyCols.map(({ c }) => <span key={c.d}><b>{c.t}:</b> {fmtMoney(totals[c.d] || 0)}</span>)}
            </div>
          )}

          {showModal && <EntityModal cfg={cfg} initial={editing} lookups={lookups} currentUser={currentUser} onClose={() => { setShowModal(false); setEditing(null); }} onSave={handleSave} />}
          {detailRow && (cfg.key === 'customers'
            ? <Customer360 customer={detailRow} currentUser={currentUser} perms={perms} lookups={lookups} onClose={() => setDetailRow(null)} />
            : (det && <DetailDrawer det={det} parent={detailRow} currentUser={currentUser} perms={perms} lookups={lookups} onClose={() => setDetailRow(null)} />))}
          {quickForm && <EntityModal cfg={MODULES[quickForm.module]} initial={quickForm.initial} lookups={lookups} currentUser={currentUser} onClose={() => setQuickForm(null)} onSave={saveQuick} />}
        </div>
      );
    }

    // ============== Reports (monthly / yearly) ==============
    function ReportsView({ currentUser, lookups }) {
      const { register: regRP } = React.useContext(PageActionsCtx);
      const acRP = useRef({});
      const now = new Date();
      const [mode, setMode] = useState('yearly');
      const [year, setYear] = useState(String(now.getFullYear()));
      const [month, setMonth] = useState(now.toISOString().slice(0, 7));
      const key = 'report:' + year + ':' + (mode === 'monthly' ? month : '');
      const { data, mutate } = useSWR(key, () => gsRun('getPeriodReport', currentUser, year, mode === 'monthly' ? month : ''), { revalidateOnFocus:false });
      const d = (data && data.success) ? data.data : null;
      const chartRef = useRef(null), chartInst = useRef(null);
      const co = (lookups && lookups.company) || {};
      const years = []; for (let y = now.getFullYear() + 1; y >= now.getFullYear() - 5; y--) years.push(String(y));
      const sel = d && mode === 'monthly' ? d.months.find(m => m.month === month) : null;

      useEffect(() => {
        if (!d || mode !== 'yearly' || !chartRef.current || typeof Chart === 'undefined') return;
        if (chartInst.current) { try { chartInst.current.destroy(); } catch (e) {} }
        chartInst.current = new Chart(chartRef.current, {
          type:'bar',
          data:{ labels:d.months.map(m => m.label), datasets:[
            { label:'Invoiced', data:d.months.map(m => m.invoiced), backgroundColor:'rgba(120,130,145,0.55)', borderRadius:5 },
            { label:'Collected', data:d.months.map(m => m.collected), backgroundColor:'#1e7e34', borderRadius:5 },
            { label:'Expenses', data:d.months.map(m => m.expenses), backgroundColor:'#b02a23', borderRadius:5 }
          ] },
          options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom' } }, scales:{ y:{ beginAtZero:true } } }
        });
        return () => { if (chartInst.current) { try { chartInst.current.destroy(); } catch (e) {} } };
      }, [d, mode]);

      const printReport = () => {
        if (!d) return;
        const money = (v) => (co.currency || 'PKR') + ' ' + (Number(v) || 0).toLocaleString('en-US');
        if (mode === 'yearly') {
          const body = d.months.map(m => `<tr><td><b>${esc(m.label)} ${esc(d.year)}</b></td>
            <td class="c">${m.invoices}</td><td class="r">${money(m.invoiced)}</td><td class="c">${m.payments}</td>
            <td class="r">${money(m.collected)}</td><td class="r">${money(m.outstanding)}</td>
            <td class="r">${money(m.expenses)}</td><td class="r b">${money(m.net)}</td>
            <td class="c">${m.new_customers}</td><td class="c">${m.recovery_pct}%</td></tr>`).join('');
          printA4('Yearly Report — ' + d.year, {
            company: co, generated: new Date().toLocaleString('en-GB'),
            chips: [['Year', d.year], ['Invoiced', money(d.totals.invoiced)], ['Collected', money(d.totals.collected)],
                    ['Expenses', money(d.totals.expenses)], ['Net', money(d.totals.net)], ['Recovery', d.totals.recovery_pct + '%']]
          }, `<table>
            <thead><tr><th>Month</th><th class="c">Inv.</th><th class="r">Invoiced</th><th class="c">Pmts</th><th class="r">Collected</th>
              <th class="r">Outstanding</th><th class="r">Expenses</th><th class="r">Net</th><th class="c">New Cust.</th><th class="c">Recovery</th></tr></thead>
            <tbody>${body}</tbody>
            <tfoot><tr><td>TOTAL ${esc(d.year)}</td><td class="c">${d.totals.invoices}</td><td class="r">${money(d.totals.invoiced)}</td>
              <td class="c">${d.totals.payments}</td><td class="r">${money(d.totals.collected)}</td><td class="r">${money(d.totals.outstanding)}</td>
              <td class="r">${money(d.totals.expenses)}</td><td class="r">${money(d.totals.net)}</td>
              <td class="c">${d.totals.new_customers}</td><td class="c">${d.totals.recovery_pct}%</td></tr></tfoot>
          </table>`, { landscape: true });
        } else {
          const body = d.byArea.map((a, i) => `<tr><td class="c">${i + 1}</td><td><b>${esc(a.area)}</b>${a.city ? `<div class="sub">${esc(a.city)}</div>` : ''}</td>
            <td class="r">${money(a.invoiced)}</td><td class="r">${money(a.collected)}</td><td class="r b">${money(a.outstanding)}</td>
            <td class="c">${a.recovery_pct}%</td></tr>`).join('');
          const tA = d.byArea.reduce((s, a) => { s.i += a.invoiced; s.c += a.collected; s.o += a.outstanding; return s; }, { i:0, c:0, o:0 });
          printA4('Monthly Report — ' + month, {
            company: co, generated: new Date().toLocaleString('en-GB'),
            chips: [['Month', month], ['Invoiced', money(sel ? sel.invoiced : 0)], ['Collected', money(sel ? sel.collected : 0)],
                    ['Expenses', money(sel ? sel.expenses : 0)], ['Net', money(sel ? sel.net : 0)], ['Recovery', (sel ? sel.recovery_pct : 0) + '%']]
          }, `<table>
            <thead><tr><th class="c">#</th><th>Area</th><th class="r">Invoiced</th><th class="r">Collected</th><th class="r">Outstanding</th><th class="c">Recovery</th></tr></thead>
            <tbody>${body || '<tr><td colspan="6" class="c">No activity in this month.</td></tr>'}</tbody>
            <tfoot><tr><td colspan="2">TOTAL</td><td class="r">${money(tA.i)}</td><td class="r">${money(tA.c)}</td><td class="r">${money(tA.o)}</td>
              <td class="c">${tA.i > 0 ? Math.round((tA.c / tA.i) * 1000) / 10 : 0}%</td></tr></tfoot>
          </table>`);
        }
      };

      acRP.current = { refresh: () => mutate(), print: printReport };
      useEffect(() => {
        regRP({ onRefresh: () => acRP.current.refresh(), tools: [{ label:'Print A4', icon:'fa-print', onClick: () => acRP.current.print() }] });
        return () => regRP(null);
      }, []);

      const kpi = (icon, color, label, value) => (
        <div className="info-box"><div className={`info-box-icon ${color}`}><i className={`fas ${icon}`}></i></div>
          <div className="info-box-content"><div className="info-box-text">{label}</div><div className="info-box-number">{value}</div></div></div>
      );

      return (
        <div className="data-section">
          <div className="filters-section">
            <div className="filters-header">
              <h3><i className="fas fa-calendar-days"></i> Reporting Period</h3>
              <div className="per-switch">
                <button className={mode === 'monthly' ? 'on' : ''} onClick={() => setMode('monthly')}><i className="fas fa-calendar-day"></i> Monthly</button>
                <button className={mode === 'yearly' ? 'on' : ''} onClick={() => setMode('yearly')}><i className="fas fa-calendar"></i> Yearly</button>
              </div>
            </div>
            <div className="filters-grid">
              <div className="filter-group"><label><i className="fas fa-calendar"></i> Year</label><SearchableDropdown options={years} value={year} onChange={setYear} /></div>
              {mode === 'monthly' && (
                <div className="filter-group"><label><i className="fas fa-calendar-day"></i> Month</label>
                  <input type="month" className="filter-input" value={month} onChange={(e) => { setMonth(e.target.value); setYear(e.target.value.slice(0, 4)); }} /></div>
              )}
            </div>
          </div>

          {!d ? <TableSkeleton rows={8} columns={6} /> : mode === 'yearly' ? (
            <>
              <div className="kpi-strip">
                {kpi('fa-file-invoice-dollar', 'ib-navy',  'Invoiced ' + d.year, fmtMoney(d.totals.invoiced))}
                {kpi('fa-hand-holding-dollar', 'ib-green', 'Collected',          fmtMoney(d.totals.collected))}
                {kpi('fa-coins',               'ib-red',   'Outstanding',        fmtMoney(d.totals.outstanding))}
                {kpi('fa-receipt',             'ib-amber', 'Expenses',           fmtMoney(d.totals.expenses))}
                {kpi('fa-sack-dollar',         'ib-teal',  'Net (Coll − Exp)',   fmtMoney(d.totals.net))}
                {kpi('fa-percent',             'ib-blue',  'Recovery Rate',      d.totals.recovery_pct + '%')}
              </div>
              <div className="lte-card">
                <div className="lte-card-head"><i className="fas fa-chart-column"></i> {d.year} — Invoiced vs Collected vs Expenses</div>
                <div className="lte-card-body" style={{ height:'320px' }}><canvas ref={chartRef}></canvas></div>
              </div>
              <div style={{ overflowX:'auto' }}>
                <table className="mini-table" style={{ width:'100%' }}>
                  <thead><tr><th>Month</th><th>Invoices</th><th>Invoiced</th><th>Payments</th><th>Collected</th><th>Outstanding</th><th>Expenses</th><th>Net</th><th>New Cust.</th><th>Recovery</th></tr></thead>
                  <tbody>
                    {d.months.map(m => (
                      <tr key={m.month} className={m.invoiced > 0 && m.recovery_pct < 50 ? 'row-warn' : (m.recovery_pct >= 90 ? 'row-ok' : '')}>
                        <td><b>{m.label}</b> <span style={{ color:'#999', fontSize:11 }}>{d.year}</span></td>
                        <td>{m.invoices}</td><td>{fmtMoney(m.invoiced)}</td>
                        <td>{m.payments}</td><td>{fmtMoney(m.collected)}</td>
                        <td>{fmtMoney(m.outstanding)}</td><td>{fmtMoney(m.expenses)}</td>
                        <td><b style={{ color: m.net >= 0 ? '#137333' : '#c5221f' }}>{fmtMoney(m.net)}</b></td>
                        <td>{m.new_customers}</td>
                        <td><span className={`eb ${m.recovery_pct >= 80 ? 'eb-ok' : (m.recovery_pct >= 50 ? 'eb-warn' : 'eb-bad')}`}>{m.recovery_pct}%</span></td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot><tr><th>TOTAL</th><th>{d.totals.invoices}</th><th>{fmtMoney(d.totals.invoiced)}</th><th>{d.totals.payments}</th>
                    <th>{fmtMoney(d.totals.collected)}</th><th>{fmtMoney(d.totals.outstanding)}</th><th>{fmtMoney(d.totals.expenses)}</th>
                    <th>{fmtMoney(d.totals.net)}</th><th>{d.totals.new_customers}</th><th>{d.totals.recovery_pct}%</th></tr></tfoot>
                </table>
              </div>
            </>
          ) : (
            <>
              <div className="kpi-strip">
                {kpi('fa-file-invoice-dollar', 'ib-navy',  'Invoiced',         fmtMoney(sel ? sel.invoiced : 0))}
                {kpi('fa-hand-holding-dollar', 'ib-green', 'Collected',        fmtMoney(sel ? sel.collected : 0))}
                {kpi('fa-coins',               'ib-red',   'Outstanding',      fmtMoney(sel ? sel.outstanding : 0))}
                {kpi('fa-receipt',             'ib-amber', 'Expenses',         fmtMoney(sel ? sel.expenses : 0))}
                {kpi('fa-sack-dollar',         'ib-teal',  'Net',              fmtMoney(sel ? sel.net : 0))}
                {kpi('fa-user-plus',           'ib-blue',  'New Customers',    sel ? sel.new_customers : 0)}
              </div>
              <div className="lte-card">
                <div className="lte-card-head"><i className="fas fa-map-location-dot"></i> Area-wise breakdown — {month}</div>
                <div className="lte-card-body" style={{ padding:0, overflowX:'auto' }}>
                  <table className="mini-table" style={{ width:'100%' }}>
                    <thead><tr><th>Area</th><th>Invoiced</th><th>Collected</th><th>Outstanding</th><th style={{ minWidth:130 }}>Recovery</th></tr></thead>
                    <tbody>
                      {d.byArea.length ? d.byArea.map(a => (
                        <tr key={a.area_id} className={a.invoiced > 0 && a.recovery_pct < 50 ? 'row-warn' : ''}>
                          <td><b>{a.area}</b>{a.city ? <><br /><span style={{ color:'#888', fontSize:12 }}>{a.city}</span></> : null}</td>
                          <td>{fmtMoney(a.invoiced)}</td><td>{fmtMoney(a.collected)}</td>
                          <td><b style={{ color: a.outstanding > 0 ? '#b02a23' : '#137333' }}>{fmtMoney(a.outstanding)}</b></td>
                          <td><div className={`abar ${a.recovery_pct < 50 ? 'low' : (a.recovery_pct < 80 ? 'mid' : '')}`}><i style={{ width: Math.max(2, Math.min(100, a.recovery_pct)) + '%' }}></i></div>
                            <span style={{ fontSize:11, color:'#888' }}>{a.recovery_pct}%</span></td>
                        </tr>
                      )) : <tr><td colSpan={5} className="ac-empty">No billing activity in {month}</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // ============== API & Integrations ==============
    const copyTxt = (t) => {
      const ok = () => Swal.fire({ icon:'success', title:'Copied', timer:900, showConfirmButton:false });
      const fb = () => { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fb); else fb();
    };
    function IntegrationsView({ currentUser }) {
      const { data, mutate } = useSWR('apikeys', () => gsRun('listApiKeys', currentUser), { revalidateOnFocus:false });
      const d = (data && data.success) ? data : null;
      const create = () => Swal.fire({ title:'New API key', input:'text', inputLabel:'Name it after where you will use it', inputPlaceholder:'e.g. Website form, Zapier, Facebook Leads', showCancelButton:true, confirmButtonText:'Create key',
          inputValidator:(v) => !String(v || '').trim() && 'Please enter a name' })
        .then(res => { if (!res.isConfirmed) return;
          gsRun('createApiKey', currentUser, res.value).then(r => {
            if (!r || !r.success) return Swal.fire({ icon:'error', title:'Error', text:(r && r.message) || 'Failed' });
            mutate();
            Swal.fire({ icon:'success', title:'Copy your API key now', confirmButtonText:'Copy & close',
              html:'<p style="font-size:13px;color:#b06000;margin-bottom:8px">For security it is shown only once. Treat it like a password.</p><code style="display:block;word-break:break-all;background:#f3f4f6;padding:10px;border-radius:8px;font-size:13px">' + esc(r.key) + '</code>' })
              .then(() => copyTxt(r.key));
          }); });
      const revoke = (k) => Swal.fire({ icon:'warning', title:'Revoke "' + k.label + '"?', text:'Any integration using this key stops working immediately.', showCancelButton:true, confirmButtonColor:'#ea4335', confirmButtonText:'Revoke' })
        .then(res => { if (res.isConfirmed) gsRun('revokeApiKey', currentUser, k.id).then(r => { Swal.fire({ icon:(r && r.success) ? 'success' : 'error', text:(r && r.message) || 'Failed', timer:1600, showConfirmButton:false }); mutate(); }); });
      if (!data) return <div className="data-section"><TableSkeleton rows={4} columns={4} /></div>;
      if (!d) return <NoAccessView />;
      const ep = d.endpoint;
      const ex1 = `{\n  "api_key": "amk_YOUR_KEY",\n  "action": "leads.create",\n  "data": {\n    "full_name": "Ali Khan",\n    "phone": "0300-1234567",\n    "email": "ali@example.com",\n    "source": "website",\n    "notes": "Interested in the premium plan"\n  }\n}`;
      const curl = `curl -L "${ep}" \\\n  -H "Content-Type: text/plain" \\\n  -d '${ex1.replace(/\n\s*/g, ' ')}'`;
      const pre = (t) => <pre style={{ background:'#0f172a', color:'#e2e8f0', padding:12, borderRadius:8, fontSize:12.5, overflowX:'auto', whiteSpace:'pre' }}>{t}</pre>;
      const acts = [
        ['leads.create','Add a lead (website form, Facebook/Google lead ads, WhatsApp bot)','data: full_name*, phone*, email, address, source, status, priority, quote_amount, next_followup_date, notes'],
        ['leads.list','Get leads (newest first)','filter: {"status":"new"} · since: "2025-01-01" · limit: 100'],
        ['leads.update','Update a lead','id* + data: status, priority, notes, next_followup_date, …'],
        ['customers.create','Add a ' + P.customer.toLowerCase(),'data: full_name*, phone*, email, address, cnic, notes'],
        ['customers.list',' Get ' + P.customers.toLowerCase(),'filter / since / limit (same as above)'],
        ['complaints.create','Open a support ticket','data: customer_id*, subject*, description, priority'],
        ['ping','Test that your key works','—']
      ];
      return (
        <div className="data-section">
          <div className="lte-card">
            <div className="lte-card-head"><i className="fas fa-key"></i> API keys <span style={{ marginLeft:'auto' }}><button className="btn btn-success btn-sm" onClick={create}><i className="fas fa-plus"></i> New API key</button></span></div>
            <div className="lte-card-body" style={{ padding:0, overflowX:'auto' }}>
              <table className="mini-table">
                <thead><tr><th>Name</th><th>Key</th><th>Created by</th><th>Created</th><th>Last used</th><th></th></tr></thead>
                <tbody>{d.data.length ? d.data.map(k => (
                  <tr key={k.id}><td><b>{k.label}</b></td><td><code>amk_…{k.hint}</code></td><td>{k.user}</td>
                    <td dangerouslySetInnerHTML={{ __html: fmtDate(k.created) }} /><td>{k.last_used ? <span dangerouslySetInnerHTML={{ __html: fmtDate(k.last_used) }} /> : <span style={{ color:'#999' }}>Never</span>}</td>
                    <td><button className="action-icon delete-icon" title="Revoke" onClick={() => revoke(k)}><i className="fas fa-ban"></i></button></td></tr>
                )) : <tr><td colSpan={6} className="ac-empty">No API keys yet. Create one to connect your website, Zapier, Make, n8n or any app.</td></tr>}</tbody>
              </table>
            </div>
          </div>

          <div className="lte-card">
            <div className="lte-card-head"><i className="fas fa-book"></i> How to connect</div>
            <div className="lte-card-body" style={{ fontSize:14, lineHeight:1.6 }}>
              <p><b>1. Endpoint</b> — send a <b>POST</b> request to:</p>
              <div style={{ display:'flex', gap:8, alignItems:'center', margin:'6px 0 14px' }}>
                <code style={{ background:'#f3f4f6', padding:'8px 10px', borderRadius:8, wordBreak:'break-all', flex:1 }}>{ep}</code>
                <button className="btn btn-secondary btn-sm" onClick={() => copyTxt(ep)}><i className="fas fa-copy"></i></button>
              </div>
              <p><b>2. Body</b> (JSON) — your key, the action and the data:</p>
              {pre(ex1)}
              <p style={{ marginTop:10 }}><b>3. Answer</b> — <code>{'{"ok":true,"id":12}'}</code> or <code>{'{"ok":false,"error":"…"}'}</code>. Turn on <b>"follow redirects"</b> in your tool (Google answers through one redirect).</p>
              <p style={{ marginTop:10 }}><b>Zapier / Make / n8n:</b> use the <i>Webhooks / HTTP request</i> step → method POST → URL above → body type <i>Raw / JSON</i> → paste the body and map your fields.</p>
              <p style={{ marginTop:10 }}><b>Command line test:</b></p>
              {pre(curl)}
              <h4 style={{ margin:'16px 0 8px', color:'var(--navy-primary)' }}>Actions</h4>
              <div style={{ overflowX:'auto' }}><table className="mini-table">
                <thead><tr><th>action</th><th>What it does</th><th>Fields (* required)</th></tr></thead>
                <tbody>{acts.map(a => <tr key={a[0]}><td><code>{a[0]}</code></td><td>{a[1]}</td><td style={{ fontSize:12.5 }}>{a[2]}</td></tr>)}</tbody>
              </table></div>
              <p style={{ marginTop:12, color:'#888', fontSize:13 }}><i className="fas fa-shield-halved"></i> Each key only works for your company, acts with the permissions of the person who created it, is limited to 60 requests per minute, and every call is recorded in the Activity Log. Revoke a key any time.</p>
            </div>
          </div>
        </div>
      );
    }

    // ============== About App ==============
    const ABOUT_ROLES = [
      { key:'super_admin', label:'Super Admin', color:'#6a1b9a' },
      { key:'admin',       label:'Admin',       color:'#c9a24b' },
      { key:'accountant',  label:'Accountant',  color:'#34a853' },
      { key:'collector',   label:'Collector',   color:'#fb8c00' }
    ];
    const ABOUT_GRANTS = {
      dashboard:'v|v|v', customers:'vaed|ve|v', areas:'vaed|v|v', packages:'vaed|v|v', equipment:'vaed|v|v',
      leads:'vaed|-|vae', complaints:'vaed|v|vae', calls:'vaed|-|vae', invoices:'vaed|vae|v', payments:'vaed|vae|va',
      expenses:'vaed|vae|-', vendors:'vaed|vae|-', banks:'-|vae|-', collections:'vaed|ve|vae',
      recovery:'v|v|v', areabalance:'v|v|v', reports:'v|v|-',
      notifications:'vaed|ve|ve', users:'vaed|-|-', logs:'v|-|-', settings:'ve|-|-', about:'v|v|v',
      allocations:'vae|vae|v', expense_payments:'vae|vae|-', attachments:'va|v|va', documents:'va|v|va', visits:'vae|v|vae'
    };
    const ABOUT_EXTRA_LABELS = { allocations:'Payment Allocations', expense_payments:'Expense Payments', attachments:'Complaint Files', documents:'Customer Documents', visits:'Collection Visits' };
    function AboutView({ role }) {
      const permCell = (g) => {
        if (!g || g === '-') return <span style={{ color:'#bbb' }}>—</span>;
        return ['v','a','e','d'].filter(p => g.indexOf(p) !== -1).map(p =>
          <span key={p} className="eb eb-ok" style={{ marginRight:4, padding:'2px 6px' }}>{ {v:'Read',a:'Create',e:'Edit',d:'Delete'}[p] }</span>);
      };
      const formulas = [
        ['Customer Total Balance', 'opening_balance + Σ invoice.total − Σ payment.amount', 'Customers list · Recovery · Customer 360 · dues panel'],
        ['Previous Balance (Baqaya)', 'opening_balance + Σ invoices billed BEFORE this month − Σ payments made BEFORE this month, floored at 0', 'Customers list · payment dues panel · Recovery · A4 arrears sheet'],
        ['Opening Balance', 'manual — arrears the customer already owed when added to the system', 'Customer form'],
        ['Invoice Paid', 'Σ payment.amount where payment.invoice_id = invoice.id', 'Invoices'],
        ['Invoice Balance', 'invoice.total − invoice.paid_amount', 'Invoices · pending list · dues panel'],
        ['Invoice Status', 'paid = 0 → unpaid · partial · paid · unpaid/partial past due → overdue. Derived from money, never set by hand', 'Invoices'],
        ['Invoice Previous Balance', 'snapshot of the customer\'s balance when the invoice is generated', 'Invoices · printed bill'],
        ['Invoice Total', 'amount − discount + tax', 'Invoices'],
        ['Collection Closing', 'opening + cash + online − expenses − deposited', 'Collection Runs'],
        ['Customer Code', '"CUS-" + zero-padded id', 'Customers'],
        ['Invoice / Receipt / Ticket / Vendor #', 'prefix ("INV/RCP/TKT/VEN") + zero-padded id', 'Invoices / Payments / Complaints / Vendors'],
        ['Duplicate guard', 'Payment ID and Slip Code must be unique; also customer code, invoice #, ticket #, vendor code, equipment serial', 'Every insert/update'],
        ['Area Balance', 'per area: Σ customer balance where > 0 · Recovery % = Σ collected ÷ Σ billed', 'Area Balances + A4 report'],
        ['Monthly / Yearly Report', 'Σ invoiced · Σ collected · Σ expenses · Net = collected − expenses · Recovery % = collected ÷ invoiced', 'Reports + A4 print'],
        ['Outstanding', 'Σ customer.current_balance where > 0', 'Dashboard · Recovery · Area Balances'],
        ['Monthly Billing Run', 'one invoice per ACTIVE customer without one for that month · amount = package price · due date = customer\'s due day', 'Invoices → Run Billing'],
        ['Soft Delete', 'is_deleted = 1 (row hidden, never removed)', 'All tables']
      ];
      return (
        <div className="about-wrap">
          <h2 style={{ color:'var(--navy-primary)', marginBottom:6 }}><i className="fas fa-circle-info"></i> About — {APP_NAME}</h2>
          <p style={{ color:'#666', marginBottom:18 }}>Customer management, billing and recovery for your business. You are signed in as <b>{role}</b>.</p>

          <h3 style={{ color:'var(--navy-primary)', margin:'10px 0' }}><i className="fas fa-user-shield"></i> Roles &amp; Permissions Matrix</h3>
          <div style={{ overflowX:'auto' }}>
            <table className="about-tbl">
              <thead><tr><th>Page</th>{ABOUT_ROLES.map(r => <th key={r.key}><span className="rbadge" style={{ background:r.color }}>{r.label}</span></th>)}</tr></thead>
              <tbody>
                {Object.keys(ABOUT_GRANTS).map(pg => {
                  const parts = ABOUT_GRANTS[pg].split('|');
                  const g = { super_admin:'vaed', admin:parts[0], accountant:parts[1] || '-', collector:parts[2] || '-' };
                  return <tr key={pg}><td style={{ fontWeight:600, textTransform:'capitalize' }}>{(PAGE_META[pg] || {}).label || ABOUT_EXTRA_LABELS[pg] || pg}</td>
                    {ABOUT_ROLES.map(r => <td key={r.key}>{permCell(g[r.key])}</td>)}</tr>;
                })}
              </tbody>
            </table>
          </div>

          <h3 style={{ color:'var(--navy-primary)', margin:'10px 0' }}><i className="fas fa-calculator"></i> Formulas &amp; Business Logic</h3>
          <div style={{ overflowX:'auto' }}>
            <table className="about-tbl">
              <thead><tr><th>What</th><th>Formula / Logic</th><th>Where Used</th></tr></thead>
              <tbody>{formulas.map((f, i) => <tr key={i}><td style={{ fontWeight:600 }}>{f[0]}</td><td>{f[1]}</td><td>{f[2]}</td></tr>)}</tbody>
            </table>
          </div>

          <p style={{ color:'#888', fontSize:13, marginTop:14 }}>
            <i className="fas fa-copyright"></i> {APP_NAME} · by Armedias. All rights reserved.
          </p>
        </div>
      );
    }

    // ============== Main Content Router ==============
    function MainContent({ activeMenu, user, email, role, perms, canEditRbac, onSettingsUpdate, onNav }) {
      const lookups = useLookups(user);
      if (MODULES[activeMenu]) {
        const cfg = MODULES[activeMenu];
        return can(perms, cfg.page, 'v') ? <EntityView key={cfg.key} cfg={cfg} currentUser={user} perms={perms} lookups={lookups} /> : <NoAccessView />;
      }
      switch (activeMenu) {
        case 'dashboard':   return can(perms, 'dashboard', 'v') ? <DashboardView currentUser={user} perms={perms} lookups={lookups} onNav={onNav} /> : <NoAccessView />;
        case 'recovery':    return can(perms, 'recovery', 'v') ? <RecoveryView currentUser={user} perms={perms} lookups={lookups} /> : <NoAccessView />;
        case 'areabalance': return can(perms, 'areabalance', 'v') ? <AreaBalanceView currentUser={user} perms={perms} lookups={lookups} /> : <NoAccessView />;
        case 'reports':     return can(perms, 'reports', 'v') ? <ReportsView currentUser={user} lookups={lookups} /> : <NoAccessView />;
        case 'users':       return can(perms, 'users', 'v') ? <UsersView currentUser={user} perms={perms} lookups={lookups} /> : <NoAccessView />;
        case 'settings':    return can(perms, 'settings', 'v') ? <SettingsView currentUser={user} role={role} onSettingsUpdate={onSettingsUpdate} /> : <NoAccessView />;
        case 'logs':        return can(perms, 'logs', 'v') ? <LogsView currentUser={user} /> : <NoAccessView />;
        case 'permissions': return canEditRbac ? <PermissionsMatrixView currentUser={user} /> : <NoAccessView />;
        case 'integrations':return can(perms, 'settings', 'e') ? <IntegrationsView currentUser={user} /> : <NoAccessView />;
        case 'about':       return <AboutView role={role} />;
        case 'account':     return <AccountView currentUser={user} currentEmail={email} role={role} />;
        default:            return <NoAccessView />;
      }
    }

    // ============== Dashboard Layout ==============
    function Dashboard({ user, email, role, companyName, daysLeft, profileImage, themeMode, permissions, canEditRbac, onThemeToggle, onSettingsUpdate, onLogout }) {
      const firstPage = can(permissions, 'dashboard', 'v') ? 'dashboard' : (can(permissions, 'settings', 'v') ? 'settings' : 'account');
      const [activeMenu, setActiveMenu] = useState(firstPage);
      const [collapsed, setCollapsed] = useState(() => { try { return localStorage.getItem('sidebarCollapsed') === '1'; } catch (e) { return false; } });
      const [showMobileSidebar, setShowMobileSidebar] = useState(false);
      useEffect(() => { try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); } catch (e) {} }, [collapsed]);

      const pageMeta = PAGE_META[activeMenu] || { label: 'Dashboard', icon: 'fa-tachometer-alt' };
      const { data: pendRes } = useSWR('pending', () => gsRun('getPendingCounts', user), { refreshInterval: 60000 });
      const pending = (pendRes && pendRes.data) || {};
      const pendingTotal = Object.keys(pending).reduce((s, k) => s + (pending[k] || 0), 0);
      const [showNotif, setShowNotif] = useState(false);
      const [refreshing, setRefreshing] = useState(false);
      const [pageActions, setPageActions] = useState(null);
      const pageCtx = React.useMemo(() => ({ register: setPageActions }), []);
      const onHeaderRefresh = () => {
        setRefreshing(true);
        Promise.resolve(pageActions && pageActions.onRefresh ? pageActions.onRefresh() : swrRefreshAll()).finally(() => setRefreshing(false));
      };
      const goNotif = (k) => { setShowNotif(false); setActiveMenu(k); setShowMobileSidebar(false); };
      const NOTIF_LABEL = { complaints:'Open Complaints', invoices:'Unpaid Invoices', recovery:'Overdue Invoices', leads:'Active Leads', calls:'Promised Follow-ups' };

      return (
        <PageActionsCtx.Provider value={pageCtx}>
          <div className={`sidebar-overlay ${showMobileSidebar ? 'show' : ''}`} onClick={() => setShowMobileSidebar(false)}></div>
          <div className="app-container">
            <Sidebar activeMenu={activeMenu} setActiveMenu={setActiveMenu} role={role} user={user} companyName={companyName} profileImage={profileImage}
              themeMode={themeMode} onThemeToggle={onThemeToggle} onLogout={onLogout} collapsed={collapsed} setCollapsed={setCollapsed}
              showMobile={showMobileSidebar} setShowMobile={setShowMobileSidebar} perms={permissions} canEditRbac={canEditRbac} pending={pending} />
            <div className="main-content">
              {daysLeft != null && daysLeft <= 7 && (
                <div className="expiry-banner"><i className="fas fa-triangle-exclamation"></i>
                  {daysLeft <= 0 ? 'Your subscription expires today.' : `Your subscription expires in ${daysLeft} day${daysLeft === 1 ? '' : 's'}.`} Please contact Armedias to renew.</div>
              )}
              <div className="header">
                <h1><i className={`fas ${pageMeta.icon}`}></i> {pageMeta.label}</h1>
                <div className="header-actions">
                  <div className="header-welcome">Welcome, {user}</div>
                  {pageActions && (pageActions.tools || []).map(t => (
                    <button key={t.label} className="btn btn-primary btn-sm" onClick={t.onClick}><i className={`fas ${t.icon}`}></i> {t.label}</button>
                  ))}
                  {pageActions && pageActions.canAdd && (
                    <button className="btn btn-success btn-sm" onClick={pageActions.onAdd}><i className="fas fa-plus"></i> Add</button>
                  )}
                  <button className="hdr-icon-btn" onClick={onHeaderRefresh} disabled={refreshing} title="Refresh"><i className={`fas fa-rotate ${refreshing ? 'fa-spin' : ''}`}></i></button>
                  <div className="hdr-notif">
                    <button className="hdr-icon-btn" onClick={() => setShowNotif(v => !v)} title="Notifications">
                      <i className="fas fa-bell"></i>
                      {pendingTotal > 0 && <span className="hdr-notif-badge">{pendingTotal > 99 ? '99+' : pendingTotal}</span>}
                    </button>
                    {showNotif && <>
                      <div className="hdr-notif-overlay" onClick={() => setShowNotif(false)}></div>
                      <div className="hdr-notif-panel">
                        <div className="hdr-notif-head"><i className="fas fa-bell"></i> Pending Work {pendingTotal > 0 ? '(' + pendingTotal + ')' : ''}</div>
                        <div className="hdr-notif-body">
                          {pendingTotal === 0
                            ? <div className="hdr-notif-empty"><i className="fas fa-check-circle"></i> All caught up 🎉</div>
                            : Object.keys(NOTIF_LABEL).filter(k => pending[k] > 0).map(k => (
                                <button key={k} className="hdr-notif-row" onClick={() => goNotif(k)}>
                                  <i className={`fas ${(PAGE_META[k] || {}).icon || 'fa-circle'}`}></i>
                                  <span>{NOTIF_LABEL[k]}</span>
                                  <span className="hdr-notif-count">{pending[k]}</span>
                                </button>
                              ))}
                        </div>
                      </div>
                    </>}
                  </div>
                </div>
              </div>
              <MainContent activeMenu={activeMenu} user={user} email={email} role={role} perms={permissions} canEditRbac={canEditRbac} onSettingsUpdate={onSettingsUpdate} onNav={setActiveMenu} />
            </div>
          </div>
          <BottomNavigation activeMenu={activeMenu} setActiveMenu={setActiveMenu} perms={permissions} setShowMobileSidebar={setShowMobileSidebar} />
        </PageActionsCtx.Provider>
      );
    }

    // ============== Main App ==============
    const readSession = () => { try { return JSON.parse(localStorage.getItem('userSession') || 'null'); } catch (e) { return null; } };
    const writeSession = (patch) => { try { const s = readSession() || {}; localStorage.setItem('userSession', JSON.stringify({ ...s, ...patch })); } catch (e) {} };
    const cacheNs = (s) => (s.companyId || '') + '/' + s.username;

    function App() {
      const [sess, setSess] = useState(null); // { token, companyId, companyName, daysLeft, username, email, role, profileImage, themeMode, customColors, permissions, canEditRbac, loginTime }
      const SESSION_DURATION = 60 * 60 * 1000;

      useEffect(() => {
        document.body.classList.toggle('dark-mode', !!(sess && sess.themeMode === 'dark'));
        if (sess && sess.customColors) { try { applyThemeVars(JSON.parse(sess.customColors)); } catch (e) {} }
      }, [sess && sess.themeMode, sess && sess.customColors]);

      const clearLocal = (s, msg) => {
        try { localStorage.removeItem('userSession'); } catch (e) {}
        if (s) swrClear(cacheNs(s));
        document.body.classList.remove('dark-mode');
        setSess(null);
        if (msg) Swal.fire({ icon:'warning', title:'Signed out', text:msg, confirmButtonColor:'var(--navy-primary)' });
      };

      useEffect(() => {
        const s = readSession();
        if (s && s.token && (Date.now() - s.loginTime) < SESSION_DURATION) {
          applyProfile(s.businessType, s.companyName, s.phoneCode);
          swrHydrate(cacheNs(s));
          swrPrefetch(s.username, s.permissions);
          setSess(s);
          gsRun('getMyPermissions', s.username).then((r) => {
            if (r && r.success) { writeSession({ permissions: r.perms, canEditRbac: !!r.canEdit }); setSess(prev => prev ? { ...prev, permissions: r.perms, canEditRbac: !!r.canEdit } : prev); }
          }).catch(() => {});
        } else if (s) clearLocal(s);

        const onExpired = (e) => clearLocal(readSession(), (e && e.detail) || 'Your session has expired. Please login again.');
        window.addEventListener('auth-expired', onExpired);
        const iv = setInterval(() => {
          const cur = readSession();
          if (cur && (Date.now() - cur.loginTime) >= SESSION_DURATION) clearLocal(cur, 'Your session has expired. Please login again.');
        }, 60000);
        return () => { clearInterval(iv); window.removeEventListener('auth-expired', onExpired); };
      }, []);

      const handleLogin = (r) => {
        const s = {
          token: r.token, companyId: r.companyId, companyName: r.companyName, daysLeft: r.daysLeft, businessType: r.businessType || 'isp', phoneCode: r.phoneCode || '91',
          username: r.username, role: r.role, email: r.email,
          profileImage: r.profileImage || '', themeMode: r.themeMode || 'light', customColors: r.customColors || '',
          permissions: r.permissions || null, canEditRbac: !!r.canEditRbac, loginTime: Date.now()
        };
        try { localStorage.setItem('userSession', JSON.stringify(s)); } catch (e) {}
        window.__memSession = s;
        if (!applyProfile(s.businessType, s.companyName, s.phoneCode)) { window.location.reload(); return; }
        swrHydrate(cacheNs(s));
        swrPrefetch(s.username, s.permissions);
        setSess(s);
      };

      const handleThemeToggle = () => {
        const newTheme = sess.themeMode === 'light' ? 'dark' : 'light';
        setSess({ ...sess, themeMode: newTheme }); writeSession({ themeMode: newTheme });
        gsRun('updateUserSettings', sess.username, { themeMode: newTheme });
      };

      const handleSettingsUpdate = () => {
        gsRun('getUserSettings', sess.username).then((result) => {
          if (result && result.success) {
            const st = result.settings;
            const patch = { profileImage: st.profileImage, themeMode: st.themeMode, customColors: st.customColors };
            writeSession(patch); setSess(prev => ({ ...prev, ...patch }));
          }
        });
      };

      const handleLogout = () => {
        Swal.fire({ icon: 'question', title: 'Logout?', text: 'Are you sure you want to logout?', showCancelButton: true, confirmButtonColor: 'var(--navy-primary)', confirmButtonText: 'Yes, Logout' })
          .then((result) => {
            if (!result.isConfirmed) return;
            const s = readSession();
            if (s && s.token) gsPublic('logout', s.token).catch(() => {});
            clearLocal(s);
            Swal.fire({ icon: 'success', title: 'Logged Out', text: 'You have been logged out successfully.', timer: 1500, showConfirmButton: false });
          });
      };

      return (
        <div>
          {!sess ? <LoginPage onLogin={handleLogin} /> : (
            <Dashboard user={sess.username} email={sess.email} role={sess.role} companyName={sess.companyName} daysLeft={sess.daysLeft}
              profileImage={sess.profileImage} themeMode={sess.themeMode} permissions={sess.permissions} canEditRbac={sess.canEditRbac}
              onThemeToggle={handleThemeToggle} onSettingsUpdate={handleSettingsUpdate} onLogout={handleLogout} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
